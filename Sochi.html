<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трасса «Сочи» — ViRAG (интерактив)</title>
    <style>
        body {
            background: #0a0e1a;
            color: #e0e8f0;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            user-select: none;
        }
        h1 {
            color: #66ccff;
            text-shadow: 0 0 20px rgba(102,204,255,0.3);
            margin-bottom: 5px;
            font-size: 24px;
        }
        .info {
            color: #88ddff;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .canvas-wrapper {
            position: relative;
            border: 1px solid rgba(102,204,255,0.2);
            border-radius: 12px;
            background: #0d1225;
            box-shadow: 0 0 40px rgba(102,204,255,0.05);
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }
        .canvas-wrapper:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 1000px;
            height: 650px;
            max-width: 100%;
            height: auto;
            background: #0d1225;
        }
        .controls-hint {
            margin-top: 10px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 12px;
            color: #88ddff;
            opacity: 0.7;
        }
        .controls-hint span {
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 12px;
        }
        .reset-btn {
            background: rgba(102,204,255,0.15);
            border: 1px solid #66ccff;
            color: #66ccff;
            padding: 4px 16px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .reset-btn:hover {
            background: rgba(102,204,255,0.3);
        }
        .legend {
            margin-top: 10px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 13px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-color { width: 20px; height: 4px; border-radius: 2px; }
        .legend-color.polygon { background: #66ccff; }
        .legend-color.pylon {
            display: inline-block;
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 16px solid #ff4466;
        }
        .footer {
            margin-top: 10px;
            color: #556677;
            font-size: 12px;
        }
        @media (max-width: 1024px) {
            canvas { width: 100%; height: auto; }
        }
    </style>
</head>
<body>
    <h1>✈️ Трасса «Сочи»</h1>
    <div class="info">17 ворот · 13 пилонов</div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="trackCanvas" width="1000" height="650"></canvas>
    </div>
    <div class="controls-hint">
        <span>🖱 ЛКМ + drag = панорамирование</span>
        <span>🔄 ПКМ + drag = вращение</span>
        <span>🔍 Колесо = масштаб</span>
        <span>🔄 Двойной клик = сброс</span>
        <button class="reset-btn" id="resetViewBtn">Сбросить вид</button>
    </div>
    <div class="legend">
        <span class="legend-item"><span class="legend-color polygon"></span> Ворота</span>
        <span class="legend-item"><span class="legend-color pylon"></span> Пилоны (конусы)</span>
        <span class="legend-item"><span style="color:#88ddff;">Цифры</span> — номера ворот</span>
        <span class="legend-item"><span style="color:#ff4466;">Круг-1</span>
        <span class="legend-item"><span style="color:#4488ff;">Круг-2</span>
    </div>
    <div class="footer">Данные из миссии ViRAG</div>

    <script>
        // ============================================================
        //  Данные трассы «Сочи»
        // ============================================================

        const gates = [
            { id: 1, vertices: [
                {x: -164363.03427076, y: 462612.44599836},
                {x: -164397.51894645, y: 462632.81096432},
                {x: -164393.82609929, y: 462638.73038109},
                {x: -164359.17850387, y: 462618.31110855}
            ]},
            { id: 2, vertices: [
                {x: -164664.81115, y: 462015.50209189},
                {x: -164698.43370472, y: 462037.50958225},
                {x: -164694.63479269, y: 462043.40444574},
                {x: -164660.96857232, y: 462021.30962407}
            ]},
            { id: 3, vertices: [
                {x: -164897.17679005, y: 461580.44032937},

                {x: -164690.44964193, y: 462048.98010056},
                {x: -164657.39497803, y: 462027.36164815}
            ]},
            { id: 5, vertices: [
                {x: -164608.24544468, y: 462336.64740159},
                {x: -164569.29613048, y: 462360.90819961},
                {x: -164565.28646493, y: 462355.68782851},
                {x: -164604.46883108, y: 462330.98248118}
            ]},
            { id: 6, vertices: [
                {x: -164746.56790759, y: 462547.56692528},
                {x: -164703.51059816, y: 462563.7999035},
                {x: -164701.16879147, y: 462557.35993509},
                {x: -164743.74709499, y: 462540.59472808}
            ]},
            { id: 7, vertices: [
                {x: -164814.76817839, y: 462779.89998019},
                {x: -164778.41734118, y: 462807.34193601},
                {x: -164773.80032965, y: 462802.26972617},
                {x: -164810.47630852, y: 462774.17748703}
            ]},
            { id: 8, vertices: [
                {x: -165116.93732245, y: 462796.99790715},
                {x: -165124.42252981, y: 462835.30681458},
                {x: -165117.58987899, y: 462836.61192766},
                {x: -165110.3349857, y: 462797.9959348}
            ]},
            { id: 9, vertices: [
                {x: -165524.65923556, y: 462565.63772436},
                {x: -165540.25316638, y: 462602.56681943},
                {x: -165534.10449057, y: 462606.08563993},
                {x: -165518.25127824, y: 462568.23053946}
            ]},
            { id: 10, vertices: [
                {x: -165110.4485483, y: 462798.0567085},
                {x: -165117.64257283, y: 462836.75232065},
                {x: -165110.06824744, y: 462837.92491496},
                {x: -165103.5397494, y: 462799.60960367}
            ]},
            { id: 11, vertices: [
                {x: -164810.51670801, y: 462774.08713919},
                {x: -164774.15759971, y: 462801.92931011},
                {x: -164770.43954583, y: 462796.43869566},
                {x: -164805.11255993, y: 462768.94239022}
            ]},
            { id: 12, vertices: [
                {x: -164740.41702726, y: 462533.87134364},
                {x: -164698.82458836, y: 462550.95523969},
                {x: -164701.2033587, y: 462557.3707112},
                {x: -164743.73288894, y: 462540.57515095}
            ]},
            { id: 13, vertices: [
                {x: -164604.47004465, y: 462330.97089043},
                {x: -164565.46250384, y: 462355.50693136},
                {x: -164561.05554504, y: 462349.37292113},
                {x: -164600.06308584, y: 462325.61107566}
            ]},
            { id: 14, vertices: [
                {x: -164698.33611169, y: 462037.57935604},
                {x: -164694.66788657, y: 462043.47257015},
                {x: -164661.05251219, y: 462021.28281497},
                {x: -164664.78087214, y: 462015.44973569}
            ]},
            { id: 15, vertices: [
                {x: -164897.18221907, y: 461580.36719267},
                {x: -164932.71664757, y: 461597.0657023},
                {x: -164929.51053372, y: 461603.34434192},
                {x: -164893.7757231, y: 461586.3118621}
            ]},
            { id: 16, vertices: [
                {x: -164660.97287895, y: 462021.36551014},
                {x: -164694.60995543, y: 462043.42424576},
                {x: -164690.46770417, y: 462049.01378962},
                {x: -164657.32969411, y: 462027.35430714}
            ]},
            { id: 17, vertices: [
                {x: -164359.25240077, y: 462618.24067128},
                {x: -164393.86953158, y: 462638.67276342},
                {x: -164389.97099446, y: 462644.49708393},
                {x: -164355.87053724, y: 462624.53469506}
            ]}
        ];

        const pylons = [
            { id: 1, x: -164365.08892539, y: 462621.85181735 },
            { id: 2, x: -164387.79192971, y: 462635.16567691 },
            { id: 3, x: -164805.01367163, y: 462778.48360308 },
            { id: 4, x: -164707.60899875, y: 462554.86387542 },
            { id: 5, x: -164598.40504712, y: 462334.73003732 },
            { id: 6, x: -164666.73888167, y: 462025.11006912 },
            { id: 7, x: -164688.76366441, y: 462039.51270708 },
            { id: 8, x: -164899.99974101, y: 461589.44156066 },
            { id: 9, x: -164923.22026224, y: 461600.23182200 },
            { id: 10, x: -165531.48647949, y: 462599.67682205 },
            { id: 11, x: -165111.47206191, y: 462804.87854858 },
            { id: 12, x: -165116.23216921, y: 462829.88645605 },
            { id: 13, x: -165521.03930196, y: 462574.69389153 }
        ];

        // ============================================================
        //  Состояние камеры
        // ============================================================

        const state = {
            rotation: 0,
            scale: 1,
            offsetX: 0,
            offsetY: 0,
            baseScale: 1,
        };

        const canvas = document.getElementById('trackCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        let allPoints = [];
        gates.forEach(g => g.vertices.forEach(v => allPoints.push({x: v.x, z: v.y})));
        pylons.forEach(p => allPoints.push({x: p.x, z: p.y}));

        const minX = Math.min(...allPoints.map(p => p.x));
        const maxX = Math.max(...allPoints.map(p => p.x));
        const minZ = Math.min(...allPoints.map(p => p.z));
        const maxZ = Math.max(...allPoints.map(p => p.z));

        const rangeX = maxX - minX;
        const rangeZ = maxZ - minZ;

        const margin = 100;
        const drawW = W - 2 * margin;
        const drawH = H - 2 * margin;
        const cosA = 0.8;
        const sinA = 0.6;
        const approxWidth = (rangeX + rangeZ) * cosA;
        const approxHeight = (rangeX + rangeZ) * sinA;
        state.baseScale = Math.min(drawW / approxWidth, drawH / approxHeight);

        const centerX = (minX + maxX) / 2;
        const centerZ = (minZ + maxZ) / 2;

        function isoProject(x, z, height = 0) {
            let dx = x - centerX;
            let dz = z - centerZ;

            const rot = state.rotation;
            const cosR = Math.cos(rot);
            const sinR = Math.sin(rot);
            const rx = dx * cosR - dz * sinR;
            const rz = dx * sinR + dz * cosR;

            const screenX = (rx - rz) * cosA * state.baseScale * state.scale + W/2 + state.offsetX;
            const screenY = (rx + rz) * sinA * state.baseScale * state.scale - height * state.baseScale * state.scale + H/2 + state.offsetY;

            return { x: screenX, y: screenY };
        }

        // ============================================================
        //  Управление мышью
        // ============================================================

        let isPanning = false;
        let isRotating = false;
        let prevMouseX = 0, prevMouseY = 0;

        const wrapper = document.getElementById('canvasWrapper');

        wrapper.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isPanning = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                wrapper.style.cursor = 'grabbing';
            } else if (e.button === 2) {
                isRotating = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                wrapper.style.cursor = 'grabbing';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                const dx = e.clientX - prevMouseX;
                const dy = e.clientY - prevMouseY;
                state.offsetX += dx;
                state.offsetY += dy;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                render();
            } else if (isRotating) {
                const dx = e.clientX - prevMouseX;
                state.rotation += dx * 0.01;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                render();
            }
        });

        window.addEventListener('mouseup', () => {
            if (isPanning || isRotating) {
                isPanning = false;
                isRotating = false;
                wrapper.style.cursor = 'grab';
            }
        });

        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            state.scale = Math.min(Math.max(state.scale * delta, 0.2), 5);
            render();
        }, { passive: false });

        wrapper.addEventListener('dblclick', resetView);
        document.getElementById('resetViewBtn').addEventListener('click', resetView);

        function resetView() {
            state.rotation = 0;
            state.scale = 1;
            state.offsetX = 0;
            state.offsetY = 0;
            render();
        }

        wrapper.addEventListener('contextmenu', (e) => e.preventDefault());

        // ============================================================
        //  Рендеринг
        // ============================================================

        function render() {
            ctx.clearRect(0, 0, W, H);

            // Сетка
            ctx.strokeStyle = 'rgba(102,204,255,0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < 10; i++) {
                const t = i / 9;
                const x = minX + t * rangeX;
                const z = minZ + t * rangeZ;
                const p1 = isoProject(x, minZ);
                const p2 = isoProject(x, maxZ);
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
                const p3 = isoProject(minX, z);
                const p4 = isoProject(maxX, z);
                ctx.beginPath();
                ctx.moveTo(p3.x, p3.y);
                ctx.lineTo(p4.x, p4.y);
                ctx.stroke();
            }

            // Ворота
            gates.forEach(g => {
                const pts = g.vertices.map(v => isoProject(v.x, v.y, 0));
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) {
                    ctx.lineTo(pts[i].x, pts[i].y);
                }
                ctx.closePath();
                ctx.strokeStyle = '#66ccff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = 'rgba(102,204,255,0.08)';
                ctx.fill();
            });

            // Пилоны – конусы
            const coneHeight = 25;
            const coneRadius = 4.5;

            pylons.forEach(p => {
                const baseCenter = isoProject(p.x, p.y, 0);
                const tip = isoProject(p.x, p.y, coneHeight);

                const r = coneRadius * state.baseScale * state.scale;
                const rx = r;
                const ry = r * 0.5;

                ctx.beginPath();
                ctx.ellipse(baseCenter.x, baseCenter.y, rx, ry, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#661122';
                ctx.fill();
                ctx.strokeStyle = '#ff4466';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const left = { x: baseCenter.x - rx, y: baseCenter.y };
                const right = { x: baseCenter.x + rx, y: baseCenter.y };
                ctx.beginPath();
                ctx.moveTo(tip.x, tip.y);
                ctx.lineTo(left.x, left.y);
                ctx.lineTo(right.x, right.y);
                ctx.closePath();
                ctx.fillStyle = 'rgba(255,68,102,0.25)';
                ctx.fill();
                ctx.strokeStyle = '#ff4466';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const angleStep = Math.PI / 6;
                for (let ang = 0; ang < Math.PI * 2; ang += angleStep) {
                    const ex = baseCenter.x + rx * Math.cos(ang);
                    const ey = baseCenter.y + ry * Math.sin(ang);
                    ctx.beginPath();
                    ctx.moveTo(tip.x, tip.y);
                    ctx.lineTo(ex, ey);
                    ctx.strokeStyle = 'rgba(255,68,102,0.3)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(tip.x, tip.y, 3, 0, 2 * Math.PI);
                ctx.fillStyle = '#ff4466';
                ctx.fill();
            });

            // Подписи
            const gateCenters = gates.map(g => {
                let cx = 0, cz = 0;
                g.vertices.forEach(v => { cx += v.x; cz += v.y; });
                cx /= g.vertices.length;
                cz /= g.vertices.length;
                return { id: g.id, x: cx, z: cz };
            });

            const centersById = {};
            gateCenters.forEach(gc => { centersById[gc.id] = gc; });

            const labelOffset = 14;

            function drawLabel(cx, cz, text, color, baseline, offset, fontSize) {
                const pos = isoProject(cx, cz, 0);
                ctx.textAlign = 'center';
                ctx.textBaseline = baseline;
                ctx.fillStyle = color;
                ctx.font = fontSize || 'bold 16px Arial';
                ctx.fillText(text, pos.x, pos.y + offset);
            }

            const skipIds = new Set([2, 4, 14, 16]);

            const g2 = centersById[2];
            const g4 = centersById[4];
            if (g2 && g4) {
                const midX = (g2.x + g4.x) / 2;
                const midY = (g2.z + g4.z) / 2;
                drawLabel(midX, midY, '2, 4', '#ff4466', 'bottom', -labelOffset);
            }

            const g14 = centersById[14];
            const g16 = centersById[16];
            if (g14 && g16) {
                const midX = (g14.x + g16.x) / 2;
                const midY = (g14.z + g16.z) / 2;
                drawLabel(midX, midY, '14, 16', '#4488ff', 'top', labelOffset);
            }

            gateCenters.forEach(gc => {
                const id = gc.id;
                if (skipIds.has(id)) return;

                let text = id.toString();
                let color = '#4488ff';
                let baseline = 'bottom';
                let offset = -labelOffset;
                let fontSize = 'bold 16px Arial';

                if (id >= 1 && id <= 8) {
                    color = '#ff4466';
                    baseline = 'bottom';
                    offset = -labelOffset;
                    if (id === 1) {
                        text = 'СТАРТ';
                        fontSize = 'bold 18px Arial';
                    }
                } else if (id >= 9 && id <= 16) {
                    color = (id === 9) ? '#ffffff' : '#4488ff';
                    baseline = 'top';
                    offset = labelOffset;
                } else if (id === 17) {
                    text = 'ФИНИШ';
                    color = '#4488ff';
                    baseline = 'top';
                    offset = labelOffset + 6;
                    fontSize = 'bold 18px Arial';
                }

                drawLabel(gc.x, gc.z, text, color, baseline, offset, fontSize);
            });

            ctx.fillStyle = '#556677';
            ctx.font = '11px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`Масштаб: ${(state.scale * state.baseScale).toFixed(3)}`, 15, H - 10);
        }

        resetView();
        console.log('Sochi interactive ready');
    </script>
