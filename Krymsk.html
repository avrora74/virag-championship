<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трасса «Крымск» — ViRAG (интерактив)</title>
    <style>
        body {
            background: #0a0e1a;
            color: #e0e8f0;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            user-select: none;
        }
        h1 {
            color: #66ccff;
            text-shadow: 0 0 20px rgba(102,204,255,0.3);
            margin-bottom: 5px;
            font-size: 24px;
        }
        .info {
            color: #88ddff;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .canvas-wrapper {
            position: relative;
            border: 1px solid rgba(102,204,255,0.2);
            border-radius: 12px;
            background: #0d1225;
            box-shadow: 0 0 40px rgba(102,204,255,0.05);
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }
        .canvas-wrapper:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 1000px;
            height: 650px;
            max-width: 100%;
            height: auto;
            background: #0d1225;
        }
        .controls-hint {
            margin-top: 10px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 12px;
            color: #88ddff;
            opacity: 0.7;
        }
        .controls-hint span {
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 12px;
        }
        .reset-btn {
            background: rgba(102,204,255,0.15);
            border: 1px solid #66ccff;
            color: #66ccff;
            padding: 4px 16px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .reset-btn:hover {
            background: rgba(102,204,255,0.3);
        }
        .legend {
            margin-top: 10px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 13px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-color { width: 20px; height: 4px; border-radius: 2px; }
        .legend-color.polygon { background: #66ccff; }
        .legend-color.pylon {
            display: inline-block;
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 16px solid #ff4466;
        }
        .footer {
            margin-top: 10px;
            color: #556677;
            font-size: 12px;
        }
        @media (max-width: 1024px) {
            canvas { width: 100%; height: auto; }
        }
    </style>
</head>
<body>
    <h1>✈️ Трасса «Крымск»</h1>
    <div class="info">19 ворот · 14 пилонов</div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="trackCanvas" width="1000" height="650"></canvas>
    </div>
    <div class="controls-hint">
        <span>🖱 ЛКМ + drag = панорамирование</span>
        <span>🔄 ПКМ + drag = вращение</span>
        <span>🔍 Колесо = масштаб</span>
        <span>🔄 Двойной клик = сброс</span>
        <button class="reset-btn" id="resetViewBtn">Сбросить вид</button>
    </div>
    <div class="legend">
        <span class="legend-item"><span class="legend-color polygon"></span> Ворота</span>
        <span class="legend-item"><span class="legend-color pylon"></span> Пилоны (конусы)</span>
        <span class="legend-item"><span style="color:#88ddff;">Цифры</span> — номера ворот</span>
        <span class="legend-item"><span style="color:#ff4466;">Круг-1</span>
        <span class="legend-item"><span style="color:#4488ff;">Круг-2</span>
    </div>
    <div class="footer">Данные из миссии ViRAG</div>

    <script>
        // ============================================================
        //  Данные трассы «Крымск»
        // ============================================================

        const gates = [

            { id: 10, vertices: [

            { id: 11, vertices: [

            ]},
            { id: 12, vertices: [
                {x: -6529.464820622, y: 293585.53165933},
                {x: -6546.9063007658, y: 293632.61808336},
                {x: -6540.5538127901, y: 293635.18136798},

            ]},
            { id: 13, vertices: [
                {x: -6692.7411230324, y: 293492.49412516},
                {x: -6723.2943933873, y: 293530.24963972},
                {x: -6717.3300349018, y: 293534.75104235},
                {x: -6686.9455671455, y: 293496.65792259}
            ]},
            { id: 14, vertices: [
                {x: -6850.0407950981, y: 293228.95755457},
                {x: -6877.1611815299, y: 293257.78968136},
                {x: -6872.1329442033, y: 293262.71093492},
                {x: -6844.8520821122, y: 293233.5578568}
            ]},
            { id: 15, vertices: [
                {x: -6909.7044469477, y: 293639.78949043},
                {x: -6934.2932525837, y: 293671.05746683},
                {x: -6928.1024197204, y: 293675.21702841},
                {x: -6904.1282362317, y: 293643.84540542}
            ]},
            { id: 16, vertices: [
                {x: -6590.790243528, y: 293868.48315681},
                {x: -6615.2021651622, y: 293900.21250584},
                {x: -6609.2375394733, y: 293904.08643798},
                {x: -6585.2560547444, y: 293872.54156192}
            ]},
            { id: 17, vertices: [
                {x: -6404.8087084269, y: 294251.27282246},
                {x: -6428.8527656189, y: 294283.09422845},
                {x: -6423.1019091151, y: 294287.14721303},
                {x: -6399.1126219851, y: 294255.59965735}
            ]},
            { id: 18, vertices: [
                {x: -5980.8455582079, y: 294313.96782287},
                {x: -5940.8166178272, y: 294344.70546708},
                {x: -5936.2346087534, y: 294339.04159475},
                {x: -5976.2635491341, y: 294308.55850661}
            ]},
            { id: 19, vertices: [
                {x: -6122.1457186216, y: 293918.26480278},
                {x: -6149.3123593696, y: 293947.52118512},
                {x: -6144.2621505126, y: 293952.04895858},
                {x: -6116.9213646316, y: 293922.96672137}
            ]}
        ];

        const pylons = [
            { id: 1, x: -6929.7514606918, y: 293665.88019438 },
            { id: 2, x: -6913.9809586526, y: 293645.15208853 },
            { id: 3, x: -6610.8628756718, y: 293894.70928073 },
            { id: 4, x: -6595.0823819403, y: 293873.80050157 },
            { id: 5, x: -6424.5471946423, y: 294277.62641539 },
            { id: 6, x: -6408.8888015524, y: 294256.77069907 },
            { id: 7, x: -5975.1588359287, y: 294318.23131223 },
            { id: 8, x: -6139.4471125813, y: 293947.08539688 },
            { id: 9, x: -6121.7551321028, y: 293927.99012592 },
            { id: 10, x: -6389.0610831496, y: 293761.66720099 },
            { id: 11, x: -6538.3128682066, y: 293628.6799617 },
            { id: 12, x: -6691.4898585659, y: 293501.90927307 },
            { id: 13, x: -6867.3147272096, y: 293257.62796689 },
            { id: 14, x: -6849.5591126943, y: 293238.60556823 }
        ];

        // ============================================================
        //  Состояние камеры
        // ============================================================

        const state = {
            rotation: 0,
            scale: 1,
            offsetX: 0,
            offsetY: 0,
            baseScale: 1,
        };

        const canvas = document.getElementById('trackCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        let allPoints = [];
        gates.forEach(g => g.vertices.forEach(v => allPoints.push({x: v.x, z: v.y})));
        pylons.forEach(p => allPoints.push({x: p.x, z: p.y}));

        const minX = Math.min(...allPoints.map(p => p.x));
        const maxX = Math.max(...allPoints.map(p => p.x));
        const minZ = Math.min(...allPoints.map(p => p.z));
        const maxZ = Math.max(...allPoints.map(p => p.z));

        const rangeX = maxX - minX;
        const rangeZ = maxZ - minZ;

        const margin = 100;
        const drawW = W - 2 * margin;
        const drawH = H - 2 * margin;
        const cosA = 0.8;
        const sinA = 0.6;
        const approxWidth = (rangeX + rangeZ) * cosA;
        const approxHeight = (rangeX + rangeZ) * sinA;
        state.baseScale = Math.min(drawW / approxWidth, drawH / approxHeight);

        const centerX = (minX + maxX) / 2;
        const centerZ = (minZ + maxZ) / 2;

        function isoProject(x, z, height = 0) {
            let dx = x - centerX;
            let dz = z - centerZ;

            const rot = state.rotation;
            const cosR = Math.cos(rot);
            const sinR = Math.sin(rot);
            const rx = dx * cosR - dz * sinR;
            const rz = dx * sinR + dz * cosR;

            const screenX = (rx - rz) * cosA * state.baseScale * state.scale + W/2 + state.offsetX;
            const screenY = (rx + rz) * sinA * state.baseScale * state.scale - height * state.baseScale * state.scale + H/2 + state.offsetY;

            return { x: screenX, y: screenY };
        }

        // ============================================================
        //  Управление мышью
        // ============================================================

        let isPanning = false;
        let isRotating = false;
        let prevMouseX = 0, prevMouseY = 0;

        const wrapper = document.getElementById('canvasWrapper');

        wrapper.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isPanning = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                wrapper.style.cursor = 'grabbing';
            } else if (e.button === 2) {
                isRotating = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                wrapper.style.cursor = 'grabbing';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                const dx = e.clientX - prevMouseX;
                const dy = e.clientY - prevMouseY;
                state.offsetX += dx;
                state.offsetY += dy;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                render();
            } else if (isRotating) {
                const dx = e.clientX - prevMouseX;
                state.rotation += dx * 0.01;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                render();
            }
        });

        window.addEventListener('mouseup', () => {
            if (isPanning || isRotating) {
                isPanning = false;
                isRotating = false;
                wrapper.style.cursor = 'grab';
            }
        });

        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            state.scale = Math.min(Math.max(state.scale * delta, 0.2), 5);
            render();
        }, { passive: false });

        wrapper.addEventListener('dblclick', resetView);
        document.getElementById('resetViewBtn').addEventListener('click', resetView);

        function resetView() {
            state.rotation = 0;
            state.scale = 1;
            state.offsetX = 0;
            state.offsetY = 0;
            render();
        }

        wrapper.addEventListener('contextmenu', (e) => e.preventDefault());

        // ============================================================
        //  Рендеринг
        // ============================================================

        function render() {
            ctx.clearRect(0, 0, W, H);

            // Сетка
            ctx.strokeStyle = 'rgba(102,204,255,0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < 10; i++) {
                const t = i / 9;
                const x = minX + t * rangeX;
                const z = minZ + t * rangeZ;
                const p1 = isoProject(x, minZ);
                const p2 = isoProject(x, maxZ);
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
                const p3 = isoProject(minX, z);
                const p4 = isoProject(maxX, z);
                ctx.beginPath();
                ctx.moveTo(p3.x, p3.y);
                ctx.lineTo(p4.x, p4.y);
                ctx.stroke();
            }

            // Ворота
            gates.forEach(g => {
                const pts = g.vertices.map(v => isoProject(v.x, v.y, 0));
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) {
                    ctx.lineTo(pts[i].x, pts[i].y);
                }
                ctx.closePath();
                ctx.strokeStyle = '#66ccff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = 'rgba(102,204,255,0.08)';
                ctx.fill();
            });

            // Пилоны – конусы
            const coneHeight = 25;
            const coneRadius = 4.5;

            pylons.forEach(p => {
                const baseCenter = isoProject(p.x, p.y, 0);
                const tip = isoProject(p.x, p.y, coneHeight);

                const r = coneRadius * state.baseScale * state.scale;
                const rx = r;
                const ry = r * 0.5;

                ctx.beginPath();
                ctx.ellipse(baseCenter.x, baseCenter.y, rx, ry, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#661122';
                ctx.fill();
                ctx.strokeStyle = '#ff4466';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const left = { x: baseCenter.x - rx, y: baseCenter.y };
                const right = { x: baseCenter.x + rx, y: baseCenter.y };
                ctx.beginPath();
                ctx.moveTo(tip.x, tip.y);
                ctx.lineTo(left.x, left.y);
                ctx.lineTo(right.x, right.y);
                ctx.closePath();
                ctx.fillStyle = 'rgba(255,68,102,0.25)';
                ctx.fill();
                ctx.strokeStyle = '#ff4466';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const angleStep = Math.PI / 6;
                for (let ang = 0; ang < Math.PI * 2; ang += angleStep) {
                    const ex = baseCenter.x + rx * Math.cos(ang);
                    const ey = baseCenter.y + ry * Math.sin(ang);
                    ctx.beginPath();
                    ctx.moveTo(tip.x, tip.y);
                    ctx.lineTo(ex, ey);
                    ctx.strokeStyle = 'rgba(255,68,102,0.3)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(tip.x, tip.y, 3, 0, 2 * Math.PI);
                ctx.fillStyle = '#ff4466';
                ctx.fill();
            });

            // Подписи ворот
            const gateCenters = gates.map(g => {
                let cx = 0, cz = 0;
                g.vertices.forEach(v => { cx += v.x; cz += v.y; });
                cx /= g.vertices.length;
                cz /= g.vertices.length;
                return { id: g.id, x: cx, z: cz };
            });

            const labelOffset = 30;

            // Пары 1-10, 2-11, ... 9-18
            for (let i = 1; i <= 9; i++) {
                const small = gateCenters.find(c => c.id === i);
                const big = gateCenters.find(c => c.id === i + 9);
                if (!small || !big) continue;
                const midX = (small.x + big.x) / 2;
                const midZ = (small.z + big.z) / 2;
                const pos = isoProject(midX, midZ, 0);

                // Верхняя подпись – малый номер (красный)
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                let label = (i === 1) ? 'СТАРТ' : i.toString();
                ctx.fillStyle = '#ff4466';
                ctx.font = (i === 1) ? 'bold 16px Arial' : 'bold 14px Arial';
                ctx.fillText(label, pos.x, pos.y - labelOffset);

                // Нижняя подпись – большой номер
                const bigId = i + 9;
                ctx.textBaseline = 'top';
                ctx.fillStyle = (bigId === 10) ? '#ffffff' : '#4488ff';
                ctx.font = 'bold 14px Arial';
                ctx.fillText(bigId.toString(), pos.x, pos.y + labelOffset);
            }

            // Финиш (ворота 19)
            const finish = gateCenters.find(c => c.id === 19);
            if (finish) {
                const pos = isoProject(finish.x, finish.z, 0);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillStyle = '#4488ff';
                ctx.font = 'bold 16px Arial';
                ctx.fillText('ФИНИШ', pos.x, pos.y + 45);
            }

            // Информация о масштабе
            ctx.fillStyle = '#556677';
            ctx.font = '11px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`Масштаб: ${(state.scale * state.baseScale).toFixed(3)}`, 15, H - 10);
        }

        resetView();
        console.log('Krymsk interactive ready');
    </script>
