<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трасса «Геленджик» — ViRAG (интерактив)</title>
    <style>
        body {
            background: #0a0e1a;
            color: #e0e8f0;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            user-select: none;
        }
        h1 {
            color: #66ccff;
            text-shadow: 0 0 20px rgba(102,204,255,0.3);
            margin-bottom: 5px;
            font-size: 24px;
        }
        .info {
            color: #88ddff;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .canvas-wrapper {
            position: relative;
            border: 1px solid rgba(102,204,255,0.2);
            border-radius: 12px;
            background: #0d1225;
            box-shadow: 0 0 40px rgba(102,204,255,0.05);
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }
        .canvas-wrapper:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 1000px;
            height: 650px;
            max-width: 100%;
            height: auto;
            background: #0d1225;
        }
        .controls-hint {
            margin-top: 10px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 12px;
            color: #88ddff;
            opacity: 0.7;
        }
        .controls-hint span {
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 12px;
        }
        .reset-btn {
            background: rgba(102,204,255,0.15);
            border: 1px solid #66ccff;
            color: #66ccff;
            padding: 4px 16px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .reset-btn:hover {
            background: rgba(102,204,255,0.3);
        }
        .legend {
            margin-top: 10px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 13px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-color { width: 20px; height: 4px; border-radius: 2px; }
        .legend-color.polygon { background: #66ccff; }
        .legend-color.pylon {
            display: inline-block;
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 16px solid #ff4466;
        }
        .footer {
            margin-top: 10px;
            color: #556677;
            font-size: 12px;
        }
        @media (max-width: 1024px) {
            canvas { width: 100%; height: auto; }
        }
    </style>
</head>
<body>
    <h1>✈️ Трасса «Геленджик»</h1>
    <div class="info">13 ворот · 12 пилонов</div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="trackCanvas" width="1000" height="650"></canvas>
    </div>
    <div class="controls-hint">
        <span>🖱 ЛКМ + drag = панорамирование</span>
        <span>🔄 ПКМ + drag = вращение</span>
        <span>🔍 Колесо = масштаб</span>
        <span>🔄 Двойной клик = сброс</span>
        <button class="reset-btn" id="resetViewBtn">Сбросить вид</button>
    </div>
    <div class="legend">
        <span class="legend-item"><span class="legend-color polygon"></span> Ворота</span>
        <span class="legend-item"><span class="legend-color pylon"></span> Пилоны (конусы)</span>
        <span class="legend-item"><span style="color:#88ddff;">Цифры</span> — номера ворот</span>
        <span class="legend-item"><span style="color:#ff4466;">Круг-1</span>
        <span class="legend-item"><span style="color:#4488ff;">Круг-2</span>
    </div>
    <div class="footer">Данные из миссии ViRAG</div>

    <script>
        // ============================================================
        //  Данные трассы «Геленджик»
        // ============================================================

        const gates = [
            { id: 1, vertices: [
                {x: -49147.249579348, y: 299257.46217034},
                {x: -49168.648928679, y: 299291.48164876},
                {x: -49162.722955018, y: 299294.71898622},
                {x: -49141.378475814, y: 299260.97385843}
            ]},
            { id: 2, vertices: [
                {x: -48675.561706993, y: 299606.61949111},
                {x: -48662.001683327, y: 299644.31433302},
                {x: -48655.47465701, y: 299641.93626917},
                {x: -48668.933486469, y: 299604.39321857}
            ]},
            { id: 3, vertices: [
                {x: -48788.18335898, y: 299964.81126378},
                {x: -48786.641070438, y: 299971.64139875},
                {x: -48747.20254914, y: 299962.82832136},
                {x: -48748.799919416, y: 299956.05326812}
            ]},
            { id: 4, vertices: [
                {x: -48771.191085304, y: 300104.59211532},
                {x: -48770.503222008, y: 300111.70003604},
                {x: -48730.607150853, y: 300106.88499297},
                {x: -48731.295014149, y: 300099.77707225}
            ]},
            { id: 5, vertices: [
                {x: -48934.111446619, y: 299227.58823234},
                {x: -48969.176852258, y: 299246.54093919},
                {x: -48965.64133202, y: 299252.68463009},
                {x: -48930.344088988, y: 299233.84784194}
            ]},
            { id: 6, vertices: [
                {x: -49568.069658272, y: 299199.67920153},
                {x: -49563.346820542, y: 299238.91508421},
                {x: -49556.323113149, y: 299238.18849379},
                {x: -49561.106500081, y: 299198.71041431}
            ]},
            { id: 7, vertices: [
                {x: -49147.249579348, y: 299257.46217034},
                {x: -49168.703798805, y: 299291.53651889},
                {x: -49162.722955018, y: 299294.71898622},
                {x: -49141.378475814, y: 299260.97385843}
            ]},
            { id: 8, vertices: [
                {x: -48675.51110989, y: 299606.5182969},
                {x: -48662.001683327, y: 299644.31433302},
                {x: -48655.525254113, y: 299641.88567206},
                {x: -48668.93348647, y: 299604.34262146}
            ]},
            { id: 9, vertices: [
                {x: -48788.18335898, y: 299964.81126378},
                {x: -48786.641070438, y: 299971.64139875},
                {x: -48747.20254914, y: 299962.93848483},
                {x: -48748.799919416, y: 299955.99818639}
            ]},
            { id: 10, vertices: [
                {x: -48771.191085304, y: 300104.59211532},
                {x: -48770.388578126, y: 300111.6427141},
                {x: -48730.549828911, y: 300106.94231491},
                {x: -48731.295014149, y: 300099.83439419}
            ]},
            { id: 11, vertices: [
                {x: -48933.995527922, y: 299227.58823234},
                {x: -48969.176852258, y: 299246.54093919},
                {x: -48965.583372672, y: 299252.74258944},
                {x: -48930.402048336, y: 299233.73192324}
            ]},
            { id: 12, vertices: [
                {x: -49568.009109071, y: 299199.67920153},
                {x: -49563.286271341, y: 299238.85453501},
                {x: -49556.323113149, y: 299238.12794459},
                {x: -49561.106500081, y: 299198.77096351}
            ]},
            { id: 13, vertices: [
                {x: -49147.194709222, y: 299257.46217034},
                {x: -49168.648928679, y: 299291.37190851},
                {x: -49162.668084892, y: 299294.71898622},
                {x: -49141.488216067, y: 299261.02872856}
            ]}
        ];

        const pylons = [
            { id: 1, x: -49165.009890404, y: 299285.41643278 },
            { id: 2, x: -49151.095604689, y: 299263.27357564 },
            { id: 3, x: -48664.382197651, y: 299637.76349033 },
            { id: 4, x: -48673.095733799, y: 299613.14739316 },
            { id: 5, x: -48781.205464909, y: 299963.37544638 },
            { id: 6, x: -48755.58567102, y: 299957.57692928 },
            { id: 7, x: -48764.247166113, y: 300103.91458235 },
            { id: 8, x: -48738.163084019, y: 300100.70704966 },
            { id: 9, x: -48959.633334024, y: 299249.32263935 },
            { id: 10, x: -48936.63986038, y: 299236.93349053 },
            { id: 11, x: -49557.21723876, y: 299231.33698185 },
            { id: 12, x: -49560.264319968, y: 299205.65005539 }
        ];

        // ============================================================
        //  Состояние камеры
        // ============================================================

        const state = {
            rotation: 0,
            scale: 1,
            offsetX: 0,
            offsetY: 0,
            baseScale: 1,
        };

        const canvas = document.getElementById('trackCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        let allPoints = [];
        gates.forEach(g => g.vertices.forEach(v => allPoints.push({x: v.x, z: v.y})));
        pylons.forEach(p => allPoints.push({x: p.x, z: p.y}));

        const minX = Math.min(...allPoints.map(p => p.x));
        const maxX = Math.max(...allPoints.map(p => p.x));
        const minZ = Math.min(...allPoints.map(p => p.z));
        const maxZ = Math.max(...allPoints.map(p => p.z));

        const rangeX = maxX - minX;
        const rangeZ = maxZ - minZ;

        const margin = 100;
        const drawW = W - 2 * margin;
        const drawH = H - 2 * margin;
        const cosA = 0.8;
        const sinA = 0.6;
        const approxWidth = (rangeX + rangeZ) * cosA;
        const approxHeight = (rangeX + rangeZ) * sinA;
        state.baseScale = Math.min(drawW / approxWidth, drawH / approxHeight);

        const centerX = (minX + maxX) / 2;
        const centerZ = (minZ + maxZ) / 2;

        function isoProject(x, z, height = 0) {
            let dx = x - centerX;
            let dz = z - centerZ;

            const rot = state.rotation;
            const cosR = Math.cos(rot);
            const sinR = Math.sin(rot);
            const rx = dx * cosR - dz * sinR;
            const rz = dx * sinR + dz * cosR;

            const screenX = (rx - rz) * cosA * state.baseScale * state.scale + W/2 + state.offsetX;
            const screenY = (rx + rz) * sinA * state.baseScale * state.scale - height * state.baseScale * state.scale + H/2 + state.offsetY;

            return { x: screenX, y: screenY };
        }

        // ============================================================
        //  Управление мышью
        // ============================================================

        let isPanning = false;
        let isRotating = false;
        let prevMouseX = 0, prevMouseY = 0;

        const wrapper = document.getElementById('canvasWrapper');

        wrapper.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isPanning = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                wrapper.style.cursor = 'grabbing';
            } else if (e.button === 2) {
                isRotating = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                wrapper.style.cursor = 'grabbing';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                const dx = e.clientX - prevMouseX;
                const dy = e.clientY - prevMouseY;
                state.offsetX += dx;
                state.offsetY += dy;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                render();
            } else if (isRotating) {
                const dx = e.clientX - prevMouseX;
                state.rotation += dx * 0.01;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                render();
            }
        });

        window.addEventListener('mouseup', () => {
            if (isPanning || isRotating) {
                isPanning = false;
                isRotating = false;
                wrapper.style.cursor = 'grab';
            }
        });

        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            state.scale = Math.min(Math.max(state.scale * delta, 0.2), 5);
            render();
        }, { passive: false });

        wrapper.addEventListener('dblclick', resetView);
        document.getElementById('resetViewBtn').addEventListener('click', resetView);

        function resetView() {
            state.rotation = 0;
            state.scale = 1;
            state.offsetX = 0;
            state.offsetY = 0;
            render();
        }

        wrapper.addEventListener('contextmenu', (e) => e.preventDefault());

        // ============================================================
        //  Рендеринг
        // ============================================================

        function render() {
            ctx.clearRect(0, 0, W, H);

            // Сетка
            ctx.strokeStyle = 'rgba(102,204,255,0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < 10; i++) {
                const t = i / 9;
                const x = minX + t * rangeX;
                const z = minZ + t * rangeZ;
                const p1 = isoProject(x, minZ);
                const p2 = isoProject(x, maxZ);
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
                const p3 = isoProject(minX, z);
                const p4 = isoProject(maxX, z);
                ctx.beginPath();
                ctx.moveTo(p3.x, p3.y);
                ctx.lineTo(p4.x, p4.y);
                ctx.stroke();
            }

            // Ворота
            gates.forEach(g => {
                const pts = g.vertices.map(v => isoProject(v.x, v.y, 0));
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) {
                    ctx.lineTo(pts[i].x, pts[i].y);
                }
                ctx.closePath();
                ctx.strokeStyle = '#66ccff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = 'rgba(102,204,255,0.08)';
                ctx.fill();
            });

            // Пилоны – конусы
            const coneHeight = 25;
            const coneRadius = 4.5;

            pylons.forEach(p => {
                const baseCenter = isoProject(p.x, p.y, 0);
                const tip = isoProject(p.x, p.y, coneHeight);

                const r = coneRadius * state.baseScale * state.scale;
                const rx = r;
                const ry = r * 0.5;

                ctx.beginPath();
                ctx.ellipse(baseCenter.x, baseCenter.y, rx, ry, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#661122';
                ctx.fill();
                ctx.strokeStyle = '#ff4466';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const left = { x: baseCenter.x - rx, y: baseCenter.y };
                const right = { x: baseCenter.x + rx, y: baseCenter.y };
                ctx.beginPath();
                ctx.moveTo(tip.x, tip.y);
                ctx.lineTo(left.x, left.y);
                ctx.lineTo(right.x, right.y);
                ctx.closePath();
                ctx.fillStyle = 'rgba(255,68,102,0.25)';
                ctx.fill();
                ctx.strokeStyle = '#ff4466';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const angleStep = Math.PI / 6;
                for (let ang = 0; ang < Math.PI * 2; ang += angleStep) {
                    const ex = baseCenter.x + rx * Math.cos(ang);
                    const ey = baseCenter.y + ry * Math.sin(ang);
                    ctx.beginPath();
                    ctx.moveTo(tip.x, tip.y);
                    ctx.lineTo(ex, ey);
                    ctx.strokeStyle = 'rgba(255,68,102,0.3)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(tip.x, tip.y, 3, 0, 2 * Math.PI);
                ctx.fillStyle = '#ff4466';
                ctx.fill();
            });

            // Подписи ворот
            const gateCenters = gates.map(g => {
                let cx = 0, cz = 0;
                g.vertices.forEach(v => { cx += v.x; cz += v.y; });
                cx /= g.vertices.length;
                cz /= g.vertices.length;
                return { id: g.id, x: cx, z: cz };
            });

            const labelOffset = 30;

            // Первые 6 ворот (красные) и вторые 6 (синие) – 7..12
            for (let i = 1; i <= 6; i++) {
                const small = gateCenters.find(c => c.id === i);
                const big = gateCenters.find(c => c.id === i + 6);
                if (!small || !big) continue;
                const midX = (small.x + big.x) / 2;
                const midZ = (small.z + big.z) / 2;
                const pos = isoProject(midX, midZ, 0);

                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                let label = (i === 1) ? 'СТАРТ' : i.toString();
                ctx.fillStyle = '#ff4466';
                ctx.font = (i === 1) ? 'bold 16px Arial' : 'bold 14px Arial';
                ctx.fillText(label, pos.x, pos.y - labelOffset);

                const bigId = i + 6;
                ctx.textBaseline = 'top';
                ctx.fillStyle = (bigId === 7) ? '#ffffff' : '#4488ff';
                ctx.font = 'bold 14px Arial';
                ctx.fillText(bigId.toString(), pos.x, pos.y + labelOffset);
            }

            // Финиш (ворота 13)
            const finish = gateCenters.find(c => c.id === 13);
            if (finish) {
                const pos = isoProject(finish.x, finish.z, 0);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillStyle = '#4488ff';
                ctx.font = 'bold 16px Arial';
                ctx.fillText('ФИНИШ', pos.x, pos.y + 45);
            }

            // Информация о масштабе
            ctx.fillStyle = '#556677';
            ctx.font = '11px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`Масштаб: ${(state.scale * state.baseScale).toFixed(3)}`, 15, H - 10);
        }

        resetView();
        console.log('Gelenjik interactive ready');
    </script>
</body>
</html>
