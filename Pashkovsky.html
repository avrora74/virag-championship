                {x: 8408.2791677268, y: 390397.25107146},

        const pylons = [
            { id: 1, x: 8404.7200186063, y: 390391.27657439 },
            { id: 2, x: 8391.7456014453, y: 390368.65158806 },
            { id: 3, x: 8040.0509812536, y: 390373.21715227 },
            { id: 4, x: 7908.0346183769, y: 390221.13447099 },
            { id: 5, x: 7775.8845756935, y: 390068.13157914 },
            { id: 6, x: 7682.141531642, y: 389725.76444543 },
            { id: 7, x: 7660.0856384436, y: 389739.55325382 },
            { id: 8, x: 7451.4311836819, y: 389457.34337015 },
            { id: 9, x: 7429.443026769, y: 389471.13761512 },
            { id: 10, x: 8331.5418506937, y: 390595.24354031 },
            { id: 11, x: 8317.5441643645, y: 390617.29403058 },
            { id: 12, x: 8702.4835761161, y: 390532.31401576 }
        ];

        // ============================================================
        //  Отрисовка
        // ============================================================

        const canvas = document.getElementById('trackCanvas');
        const ctx = canvas.getContext('2d');

        let allPoints = [];
        gates.forEach(g => {
            g.vertices.forEach(v => {
                allPoints.push({x: v.x, y: v.y});
            });
        });
        pylons.forEach(p => {
            allPoints.push({x: p.x, y: p.y});
        });

        const minX = Math.min(...allPoints.map(p => p.x));
        const maxX = Math.max(...allPoints.map(p => p.x));
        const minY = Math.min(...allPoints.map(p => p.y));
        const maxY = Math.max(...allPoints.map(p => p.y));

        const rangeX = maxX - minX;
        const rangeY = maxY - minY;

        const marginTop = 80;
        const marginBottom = 120;
        const marginLeft = 80;
        const marginRight = 80;

        const canvasW = canvas.width;
        const canvasH = canvas.height;
        const drawW = canvasW - marginLeft - marginRight;
        const drawH = canvasH - marginTop - marginBottom;

        const scale = Math.min(drawW / rangeX, drawH / rangeY);
        const offsetX = (drawW - rangeX * scale) / 2 + marginLeft;
        const offsetY = (drawH - rangeY * scale) / 2 + marginTop;

        function toPixel(x, y) {
            return { x: (x - minX) * scale + offsetX, y: (y - minY) * scale + offsetY };
        }

        ctx.clearRect(0, 0, canvasW, canvasH);

        // Сетка
        ctx.strokeStyle = 'rgba(102,204,255,0.05)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < 10; i++) {
            const x = marginLeft + i * drawW / 10;
            ctx.beginPath();
            ctx.moveTo(x, marginTop);
            ctx.lineTo(x, canvasH - marginBottom);
            ctx.stroke();
            const y = marginTop + i * drawH / 10;
            ctx.beginPath();
            ctx.moveTo(marginLeft, y);
            ctx.lineTo(canvasW - marginRight, y);
            ctx.stroke();
        }

        // Центры ворот
        const gateCenters = gates.map(g => {
            let cx = 0, cy = 0;
            g.vertices.forEach(v => { cx += v.x; cy += v.y; });
            cx /= g.vertices.length;
            cy /= g.vertices.length;
            return { id: g.id, x: cx, y: cy };
        });

        const centersById = {};
        gateCenters.forEach(gc => { centersById[gc.id] = gc; });

        // Рисуем ворота (полигоны)
        gates.forEach(g => {
            const pts = g.vertices.map(v => toPixel(v.x, v.y));
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) {
                ctx.lineTo(pts[i].x, pts[i].y);
            }
            ctx.closePath();
            ctx.strokeStyle = '#66ccff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = 'rgba(102,204,255,0.08)';
            ctx.fill();
        });

        // ---- Подписи ----
        const labelOffset = 20;

        function drawLabel(cx, cy, text, color, baseline, offset, fontSize) {
            const pos = toPixel(cx, cy);
            ctx.textAlign = 'center';
            ctx.textBaseline = baseline;
            ctx.fillStyle = color;
            ctx.font = fontSize || 'bold 16px Arial';
            ctx.fillText(text, pos.x, pos.y + offset);
        }

        // Объединённые пары первого круга (красные, сверху)
        const mergedFirst = [
            [2, 10],
            [3, 9],
            [4, 8],
            [5, 7]
        ];
        mergedFirst.forEach(([id1, id2]) => {
            const c1 = centersById[id1];
            const c2 = centersById[id2];
            if (c1 && c2) {
                const midX = (c1.x + c2.x) / 2;
                const midY = (c1.y + c2.y) / 2;
                drawLabel(midX, midY, id1 + ', ' + id2, '#ff4466', 'bottom', -labelOffset);
            }
        });

        // Объединённые пары второго круга (синие, снизу)
        const mergedSecond = [
            [14, 22],
            [15, 21],
            [16, 20],
            [17, 19]
        ];
        mergedSecond.forEach(([id1, id2]) => {
            const c1 = centersById[id1];
            const c2 = centersById[id2];
            if (c1 && c2) {
                const midX = (c1.x + c2.x) / 2;
                const midY = (c1.y + c2.y) / 2;
                drawLabel(midX, midY, id1 + ', ' + id2, '#4488ff', 'top', labelOffset);
            }
        });

        // Номера, которые теперь объединены и не должны выводиться отдельно
        const skipIds = new Set([
            2,3,4,5,7,8,9,10,   // первый круг
            14,15,16,17,19,20,21,22 // второй круг
        ]);

        // Остальные подписи
        gateCenters.forEach(gc => {
            const id = gc.id;
            if (skipIds.has(id)) return;

            const pos = toPixel(gc.x, gc.y);
            let text = id.toString();
            let color = '#88ddff';
            let baseline = 'bottom';
            let offset = -labelOffset;
            let fontSize = 'bold 16px Arial';

            // Специальная обработка для СТАРТ и ФИНИШ
            if (id === 1) {
                text = 'СТАРТ';
                color = '#ff4466';
                baseline = 'bottom';
                offset = -labelOffset - 6;
                fontSize = 'bold 18px Arial';
            } else if (id === 25) {
                text = 'ФИНИШ';
                color = '#4488ff';
                baseline = 'top';
                offset = labelOffset + 22; // уменьшено с 26 для сокращения интервала с 13
                fontSize = 'bold 18px Arial';
            } else {
                // Общие правила для остальных ворот
                if (id >= 1 && id <= 8) {
                    color = '#ff4466';
                    baseline = 'bottom';
                    offset = -labelOffset;
                } else if (id >= 9 && id <= 16) {
                    if (id === 13) {
                        color = '#ffffff';
                    } else {
                        color = '#4488ff';
                    }
                    baseline = 'top';
                    offset = labelOffset;
                } else if (id >= 17 && id <= 25) {
                    color = '#4488ff';
                    baseline = 'top';
                    offset = labelOffset;
                }
                // Для 11 и 12 – красные сверху
                if (id === 11 || id === 12) {
                    color = '#ff4466';
                    baseline = 'bottom';
                    offset = -labelOffset;
                }
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = baseline;
            ctx.fillStyle = color;
            ctx.font = fontSize;
            ctx.fillText(text, pos.x, pos.y + offset);
        });

        // Рисуем пилоны
        pylons.forEach(p => {
            const pos = toPixel(p.x, p.y);
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 6, 0, 2 * Math.PI);
            ctx.fillStyle = '#ff4466';
            ctx.fill();
            ctx.strokeStyle = '#ff8899';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        });
