<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ТРАССА — Пашковский</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background-color: #b0d0e8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1a1a2e;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.70);
            padding: 8px 24px;
            border-radius: 30px;
            pointer-events: none;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid rgba(255,255,255,0.4);
            backdrop-filter: blur(4px);
            z-index: 10;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #1a2a3a;
            text-shadow: 0 1px 4px rgba(255,255,255,0.5);
        }
        #controls {
            position: absolute;
            left: 20px;
            bottom: 20px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            pointer-events: auto;
            padding: 10px 14px;
            display: grid;
            grid-template-rows: auto auto auto;
            gap: 6px;
            min-width: 280px;
            max-width: 480px;
            width: fit-content;
            max-height: 95vh;
            overflow: hidden;
        }
        #controls .row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            min-height: 28px;
        }
        #controls .row:last-child {
            min-height: 24px;
        }
        #controls button {
            background: #2a6f8a;
            border: none;
            color: white;
            font-size: 14px;
            padding: 4px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            flex-shrink: 0;
            white-space: nowrap;
            height: 26px;
            line-height: 1;
        }
        #controls button:hover { background: #3a8aaa; }
        #controls button:active { transform: scale(0.97); }
        #controls label {
            color: rgba(255,255,255,0.85);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        #controls input[type="range"] {
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
            cursor: pointer;
            flex: 1 1 auto;
            min-width: 30px;
            max-width: 120px;
        }
        #controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #88ccff;
            border: 2px solid white;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(136,204,255,0.5);
        }
        #controls input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #88ccff;
            border: 2px solid white;
            cursor: pointer;
        }
        .val-label {
            color: white;
            font-size: 12px;
            min-width: 34px;
            text-align: center;
            font-weight: 500;
            flex-shrink: 0;
        }
        #telemetry {
            display: flex;
            flex-wrap: nowrap;
            gap: 4px 10px;
            color: white;
            font-size: 12px;
            background: rgba(0,0,0,0.2);
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            justify-content: space-between;
            width: 100%;
            overflow: hidden;
            flex: 1;
            min-height: 22px;
            align-items: center;
        }
        #telemetry span {
            white-space: nowrap;
            flex-shrink: 0;
        }
        #telemetry .val {
            font-weight: 600;
            color: #88ccff;
        }
        #controls-note {
            position: absolute;
            bottom: 100px;
            right: 30px;
            background: rgba(255,255,255,0.5);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            opacity: 0.5;
            z-index: 10;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.3);
            color: #1a2a3a;
            backdrop-filter: blur(2px);
        }
        @media (max-width: 700px) {
            #controls {
                left: 10px;
                bottom: 10px;
                padding: 8px 10px;
                min-width: 200px;
                max-width: 340px;
                gap: 4px;
            }
            #controls button { font-size: 12px; padding: 3px 10px; height: 22px; }
            #controls label { font-size: 10px; }
            .val-label { font-size: 10px; min-width: 28px; }
            #telemetry { font-size: 10px; gap: 3px 6px; padding: 1px 6px; min-height: 18px; }
            #controls input[type="range"] { min-width: 20px; max-width: 80px; }
            #controls .row { min-height: 22px; gap: 4px; }
            #controls .row:last-child { min-height: 18px; }
        }
        @media (max-width: 500px) {
            #controls {
                left: 6px;
                bottom: 6px;
                padding: 6px 8px;
                min-width: 150px;
                max-width: 280px;
                gap: 3px;
                border-radius: 12px;
            }
            #controls button { font-size: 10px; padding: 2px 8px; height: 18px; }
            #controls label { font-size: 9px; }
            .val-label { font-size: 9px; min-width: 22px; }
            #telemetry { font-size: 8px; gap: 2px 4px; padding: 1px 4px; min-height: 16px; }
            #controls input[type="range"] { min-width: 16px; max-width: 60px; height: 3px; }
            #controls input[type="range"]::-webkit-slider-thumb { width: 12px; height: 12px; }
            #controls .row { min-height: 18px; gap: 3px; }
            #controls .row:last-child { min-height: 16px; }
        }
        @media (max-width: 640px) {
            #info { font-size: 16px; padding: 6px 16px; top: 12px; }
            #controls-note { display: none; }
        }
    </style>
</head>
<body>
    <div id="info">ТРАССА — Пашковский | Ворот: 25 | Пилонов: 12</div>
    <div id="controls-note">🖱 Мышь: вращение · колёсико: масштаб</div>

    <!-- ========== ПАНЕЛЬ УПРАВЛЕНИЯ (как в Anapa) ========== -->

        <!-- Строка 1: Кнопка + Прогресс -->
        <div class="row">
            <button id="playBtn">▶ Старт</button>
            <label>Прогресс</label>
            <input type="range" id="progressSlider" min="0" max="100" value="0" />
            <span class="val-label" id="progress-label">0%</span>
        </div>
        <!-- Строка 2: Скорость + Масштаб -->
        <div class="row">
            <label>Скорость</label>
            <input type="range" id="speedSlider" min="0.25" max="3" step="0.05" value="1.0" />
            <span class="val-label" id="speed-label">1.00×</span>
            <label>Масштаб</label>
            <input type="range" id="scaleSlider" min="1" max="4" step="1" value="2" />
            <span class="val-label" id="scale-label">2</span>
        </div>
        <!-- Строка 3: Телеметрия -->
        <div class="row" style="padding:0;">
            <div id="telemetry">
                <span>Время: <span class="val" id="t-time">0.00</span> с</span>
                <span>Скорость: <span class="val" id="t-speed">0</span> км/ч</span>
                <span>Высота: <span class="val" id="t-height">0</span> м</span>
                <span>Крен: <span class="val" id="t-roll">0.0</span>°</span>
                <span>Тангаж: <span class="val" id="t-pitch">0.0</span>°</span>
            </div>
        </div>
    </div>

                    [8408.2791677268, 390397.25107146],
                    [8388.1440220044, 390362.75285512]
                ]]
        ];

        const pylonData = [
            [1, 8404.7200186063, 390391.27657439],
            [2, 8391.7456014453, 390368.65158806],
            [3, 8040.0509812536, 390373.21715227],
            [4, 7908.0346183769, 390221.13447099],
            [5, 7775.8845756935, 390068.13157914],
            [6, 7682.141531642, 389725.76444543],
            [7, 7660.0856384436, 389739.55325382],
            [8, 7451.4311836819, 389457.34337015],
            [9, 7429.443026769, 389471.13761512],
            [10, 8331.5418506937, 390595.24354031],
            [11, 8317.5441643645, 390617.29403058],
            [12, 8702.4835761161, 390532.31401576]
        ];

        // ---------- Преобразования координат ----------
        function transformX(x) { return -(x - CENTER_X); }
        function transformY(y) { return -(y - CENTER_Y); }

        // ---------- Сцена ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xb0d0e8);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 50000);
        camera.position.set(1500, 1200, 1800);
        camera.lookAt(0, 100, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.localClippingEnabled = true;
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 120, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 300;
        controls.maxDistance = 5000;
        controls.update();

        // ---------- Освещение ----------
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.0);
        dirLight.position.set(400, 800, 600);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        const d = 1500;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 2000;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xccddff, 0.4);
        fillLight.position.set(-400, 300, -600);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffffff, 0.2);
        rimLight.position.set(0, -200, 800);
        scene.add(rimLight);

        // ---------- Земля ----------
        const groundGeo = new THREE.PlaneGeometry(2800, 2800);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x6a9e5a,
            roughness: 0.9,
            metalness: 0.0,
            side: THREE.DoubleSide,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(2400, 40, 0x4a7a3a, 0x3a6a2a);
        gridHelper.position.y = -0.5;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.15;
        scene.add(gridHelper);

        // ---------- Ворота (кластеризация и метки) ----------
        const gateCenters = gateData.map(([num, verts]) => {
            const pts = verts.map(v => new THREE.Vector3(transformX(v[0]), 0, transformY(v[1])));
            const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
            const cz = pts.reduce((s, p) => s + p.z, 0) / pts.length;
            return { num, cx, cz };
        });

        const meanXtrans = gateCenters.reduce((s, g) => s + g.cx, 0) / gateCenters.length;
        const meanYtrans = gateCenters.reduce((s, g) => s + g.cz, 0) / gateCenters.length;
        const clusterThreshold = 50;
        const clusters = [];
        const used = new Set();
        for (let i = 0; i < gateCenters.length; i++) {
            if (used.has(i)) continue;
            const cluster = [gateCenters[i]];
            used.add(i);
            for (let j = i + 1; j < gateCenters.length; j++) {
                if (used.has(j)) continue;
                const dx = gateCenters[i].cx - gateCenters[j].cx;
                const dz = gateCenters[i].cz - gateCenters[j].cz;
                const dist = Math.sqrt(dx*dx + dz*dz);
                if (dist < clusterThreshold) {
                    cluster.push(gateCenters[j]);
                    used.add(j);
                }
            }
            clusters.push(cluster);
        }

        const baseY = 55;
        const offsetDist = 60;
        const halfGates = Math.ceil(gateData.length / 2); // 13

        for (const cluster of clusters) {
            cluster.sort((a, b) => a.num - b.num);
            let avgX = cluster.reduce((s, g) => s + g.cx, 0) / cluster.length;
            let avgZ = cluster.reduce((s, g) => s + g.cz, 0) / cluster.length;
            const dx = avgX - meanXtrans;
            const dz = avgZ - meanYtrans;
            const len = Math.sqrt(dx*dx + dz*dz);
            if (len > 1) {
                avgX += (dx / len) * offsetDist;
                avgZ += (dz / len) * offsetDist;
            } else {
                avgX += offsetDist;
                avgZ += 0;
            }
            const numbers = cluster.map(g => g.num);
            const allRed = numbers.every(n => n <= halfGates);
            const allBlue = numbers.every(n => n > halfGates);
            let borderColor = 'rgba(255,255,255,0.3)';
            if (allRed) borderColor = 'rgba(204, 51, 51, 0.4)';
            else if (allBlue) borderColor = 'rgba(26, 107, 138, 0.4)';

            const container = document.createElement('div');
            container.style.display = 'inline-block';
            container.style.background = 'rgba(255, 255, 255, 0.10)';
            container.style.padding = '2px 10px';
            container.style.borderRadius = '4px';
            container.style.border = `1px solid ${borderColor}`;
            container.style.backdropFilter = 'blur(1px)';
            container.style.fontFamily = 'monospace';
            container.style.fontSize = '14px';
            container.style.fontWeight = 'bold';
            container.style.textShadow = '0 0 10px rgba(255,255,255,0.8), 0 0 4px rgba(255,255,255,0.6)';
            container.style.color = '#1a1a2e';
            const parts = numbers.map(n => {
                const color = n <= halfGates ? '#cc3333' : '#1a6b8a';
                return `<span style="color:${color}; text-shadow: 0 0 6px rgba(255,255,255,0.7);">#${n}</span>`;
            });
            container.innerHTML = parts.join(', ');
            const label = new CSS2DObject(container);
            label.position.set(avgX, baseY, avgZ);

        // ---------- Пилоны ----------
        function createPylon(num, x, y) {
            const group = new THREE.Group();
            const px = transformX(x);
            const pz = transformY(y);
            const coneMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.5,
                metalness: 0.2,
            });
            const coneGeo = new THREE.CylinderGeometry(0, PYLON_RADIUS, PYLON_HEIGHT, 16, 1);
            const cone = new THREE.Mesh(coneGeo, coneMat);
            cone.position.set(px, PYLON_HEIGHT / 2, pz);
            cone.castShadow = true;
            cone.receiveShadow = true;
            group.add(cone);

            const topHeight = 4;
            const topRadius = PYLON_RADIUS * (1 - (PYLON_HEIGHT - topHeight) / PYLON_HEIGHT);
            const topMat = new THREE.MeshStandardMaterial({
                color: 0xff0000,
                roughness: 0.3,
                metalness: 0.1,
                emissive: 0xff0000,
                emissiveIntensity: 0.15,
            });
            const topGeo = new THREE.CylinderGeometry(0, topRadius, topHeight, 16);
            const topCone = new THREE.Mesh(topGeo, topMat);
            topCone.position.set(px, PYLON_HEIGHT - topHeight/2, pz);
            topCone.castShadow = true;
            topCone.receiveShadow = true;
            group.add(topCone);

            const stripHeight = 1.5;
            const midHeight = PYLON_HEIGHT / 2;
            const radiusAtMid = PYLON_RADIUS * (1 - midHeight / PYLON_HEIGHT);
            const stripMat = new THREE.MeshStandardMaterial({
                color: 0xff0000,
                roughness: 0.3,
                metalness: 0.1,
                emissive: 0xff0000,
                emissiveIntensity: 0.15,
            });
            const stripGeo = new THREE.CylinderGeometry(radiusAtMid + 0.6, radiusAtMid + 0.6, stripHeight, 16);
            const strip = new THREE.Mesh(stripGeo, stripMat);
            strip.position.set(px, midHeight, pz);
            strip.castShadow = true;
            strip.receiveShadow = true;
            group.add(strip);
            scene.add(group);
        }
        for (const [num, x, y] of pylonData) {
            createPylon(num, x, y);
        }

        // ---------- Определение моментов входа в зону ворот (по радиусу) ----------
        function findGateTimeIndices(gateNum, radius) {
            const gate = gateCenters.find(g => g.num === gateNum);
            if (!gate) return { enter: -1, exit: -1 };
            let enterIdx = -1, exitIdx = -1;
            for (let i = 0; i < NUM_POINTS; i++) {
                const dx = pts[i].x - gate.cx;
                const dz = pts[i].z - gate.cz;
                const dist = dx*dx + dz*dz;
                if (dist < radius*radius) {
                    if (enterIdx === -1) enterIdx = i;
                    exitIdx = i;
                }
            }
            return { enter: enterIdx, exit: exitIdx };
        }

        const startGate = findGateTimeIndices(1, GATE_RADIUS);
        const endGate = findGateTimeIndices(25, GATE_RADIUS);

        // ================================================================

        // ================================================================
        function buildAirplane() {
            const group = new THREE.Group();

            function createTrapezoidGeometry(points) {
                const geom = new THREE.BufferGeometry();
                const verts = points.flat();
                geom.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
                geom.setIndex([0, 1, 2, 0, 2, 3]);
                geom.computeVertexNormals();
                return geom;
            }

            function createSolidTrapezoid(points, thickness, topMat, bottomMat, sideMat) {
                const group = new THREE.Group();
                const geom = createTrapezoidGeometry(points);

                const upper = new THREE.Mesh(geom.clone(), topMat);
                upper.position.y = thickness / 2;
                upper.castShadow = true;
                upper.receiveShadow = true;
                group.add(upper);

                const lower = new THREE.Mesh(geom.clone(), bottomMat);
                lower.position.y = -thickness / 2;
                lower.castShadow = true;
                lower.receiveShadow = true;
                group.add(lower);

                const top = points.map(p => new THREE.Vector3(p[0], thickness / 2, p[2]));
                const bottom = points.map(p => new THREE.Vector3(p[0], -thickness / 2, p[2]));

                function addSide(v0, v1, v2, v3) {
                    const g = new THREE.BufferGeometry();
                    const verts = new Float32Array([
                        v0.x, v0.y, v0.z,
                        v1.x, v1.y, v1.z,
                        v2.x, v2.y, v2.z,
                        v0.x, v0.y, v0.z,
                        v2.x, v2.y, v2.z,
                        v3.x, v3.y, v3.z
                    ]);
                    g.setAttribute('position', new THREE.BufferAttribute(verts, 3));
                    g.computeVertexNormals();
                    const mesh = new THREE.Mesh(g, sideMat);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    group.add(mesh);
                }

                addSide(top[0], top[3], bottom[3], bottom[0]);
                addSide(top[1], top[2], bottom[2], bottom[1]);
                addSide(top[0], top[1], bottom[1], bottom[0]);
                addSide(top[3], top[2], bottom[2], bottom[3]);

                return group;
            }

            function createSolidKeel(points, thickness, material) {
                const group = new THREE.Group();

                const top = points.map(p => new THREE.Vector3(thickness / 2, p[1], p[2]));
                const bottom = points.map(p => new THREE.Vector3(-thickness / 2, p[1], p[2]));

                function addQuad(v0, v1, v2, v3) {
                    const g = new THREE.BufferGeometry();
                    const verts = new Float32Array([
                        v0.x, v0.y, v0.z,
                        v1.x, v1.y, v1.z,
                        v2.x, v2.y, v2.z,
                        v0.x, v0.y, v0.z,
                        v2.x, v2.y, v2.z,
                        v3.x, v3.y, v3.z
                    ]);
                    g.setAttribute('position', new THREE.BufferAttribute(verts, 3));
                    g.computeVertexNormals();
                    const mesh = new THREE.Mesh(g, material);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    group.add(mesh);
                }

                addQuad(top[0], top[3], bottom[3], bottom[0]);
                addQuad(top[1], top[2], bottom[2], bottom[1]);
                addQuad(top[0], top[1], bottom[1], bottom[0]);
                addQuad(top[3], top[2], bottom[2], bottom[3]);

                addQuad(top[0], top[1], top[2], top[3]);
                addQuad(bottom[0], bottom[1], bottom[2], bottom[3]);

                return group;
            }

            const fuselageLength = 7.676;

            const cylHeight = trailingEdgeZ - (-halfLen);
            const cylCenterZ = (-halfLen + trailingEdgeZ) / 2;

            const fuseWhiteMat = new THREE.MeshStandardMaterial({

            const wingRootChord = 2.0;

            const rightWingPoints = [
                [0, 0, -wingRootChord / 2],

            const rightWing = createSolidTrapezoid(

            const rightStab = createSolidTrapezoid(

            const keel = createSolidKeel(keelPoints, keelThickness, keelMat);

                dir = normalize(pts[i1].clone().sub(pts[i0]));
            } else {
                dir = normalize(pts[i0].clone().sub(pts[Math.max(i0 - 1, 0)]));
            }
            if (dir.length() < 0.001) {
                dir = new THREE.Vector3(0, 0, 1);
            }

            const yaw = Math.atan2(dir.x, dir.z);
            const pitch0 = trajectory[i0].pitch;
            const pitch1 = trajectory[i1].pitch;
            const pitch = pitch0 + (pitch1 - pitch0) * frac;
            const roll0 = trajectory[i0].roll;
            const roll1 = trajectory[i1].roll;
            const roll = roll0 + (roll1 - roll0) * frac;

            airplaneGroup.rotation.order = 'YXZ';
            airplaneGroup.rotation.y = yaw + Math.PI;
            airplaneGroup.rotation.x = pitch;
            airplaneGroup.rotation.z = -roll;

            const progress = (idx / (NUM_POINTS - 1)) * 100;
            progressSlider.value = progress;
            progressLabel.textContent = Math.round(progress) + '%';

            // --- Телеметрия (время по данным) ---
            const t0 = trajectory[i0];
            const t1 = trajectory[i1];
            const time = t0.time + (t1.time - t0.time) * frac;

            let displayTime = 0;
            if (time >= startTime && time <= endTime) {
                displayTime = time - startTime;
            } else if (time > endTime) {
                displayTime = endTime - startTime;
            }

            const speed = t0.speedKmh + (t1.speedKmh - t0.speedKmh) * frac;
            const height = t0.heightAGL + (t1.heightAGL - t0.heightAGL) * frac;
            const rollDeg = t0.rollDeg + (t1.rollDeg - t0.rollDeg) * frac;
            const pitchDeg = t0.pitchDeg + (t1.pitchDeg - t0.pitchDeg) * frac;

            elTime.textContent = displayTime.toFixed(2);
            elSpeed.textContent = Math.round(speed);
            elHeight.textContent = height.toFixed(1);
            elRoll.textContent = rollDeg.toFixed(1);
            elPitch.textContent = pitchDeg.toFixed(1);
        }

        updateAirplane(0);

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playBtn.textContent = isPlaying ? '⏸ Пауза' : '▶ Старт';
            if (isPlaying && currentIndex >= NUM_POINTS - 1) {
                currentIndex = 0;
            }
        });

        progressSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            const idx = (val / 100) * (NUM_POINTS - 1);
            currentIndex = idx;
            updateAirplane(idx);
        });

        speedSlider.addEventListener('input', (e) => {
            speedFactor = parseFloat(e.target.value);
            speedLabel.textContent = speedFactor.toFixed(2) + '×';
        });

        scaleSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            updateScale(val);
        });

        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const delta = (now - lastTime) / 1000;
            lastTime = now;

            if (isPlaying) {
                const deltaIndex = (delta / 0.3) * speedFactor;
                currentIndex += deltaIndex;
                if (currentIndex >= NUM_POINTS - 1) {
                    currentIndex = NUM_POINTS - 1;
                    isPlaying = false;
                    playBtn.textContent = '▶ Старт';
                }
                updateAirplane(currentIndex);
            }

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            labelRenderer.setSize(w, h);
        });

        console.log('ТРАССА — Пашковский (высота из Height_AGL, время по зоне ворот)');
    </script>
</body>
</html>
