<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Трасса «Пашковский» — ViRAG (интерактив)</title>
    <style>
        body {
            background: #0a0e1a;
            color: #e0e8f0;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            user-select: none;
        }
        h1 {
            color: #66ccff;
            text-shadow: 0 0 20px rgba(102,204,255,0.3);
            margin-bottom: 5px;
            font-size: 24px;
        }
        .info {
            color: #88ddff;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .canvas-wrapper {
            position: relative;
            border: 1px solid rgba(102,204,255,0.2);
            border-radius: 12px;
            background: #0d1225;
            box-shadow: 0 0 40px rgba(102,204,255,0.05);
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }
        .canvas-wrapper:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 1000px;
            height: 650px;
            max-width: 100%;
            height: auto;
            background: #0d1225;
        }
        .controls-hint {
            margin-top: 10px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 12px;
            color: #88ddff;
            opacity: 0.7;
        }
        .controls-hint span {
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 12px;
        }
        .reset-btn {
            background: rgba(102,204,255,0.15);
            border: 1px solid #66ccff;
            color: #66ccff;
            padding: 4px 16px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .reset-btn:hover {
            background: rgba(102,204,255,0.3);
        }
        .legend {
            margin-top: 10px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 13px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-color { width: 20px; height: 4px; border-radius: 2px; }
        .legend-color.polygon { background: #66ccff; }
        .legend-color.pylon {
            display: inline-block;
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 16px solid #ff4466;
        }
        .footer {
            margin-top: 10px;
            color: #556677;
            font-size: 12px;
        }
        @media (max-width: 1024px) {
            canvas { width: 100%; height: auto; }
        }
    </style>
</head>

    <div class="info">25 ворот · 12 пилонов</div>

        <span>🔍 Колесо = масштаб</span>
        <span>🔄 Двойной клик = сброс</span>
        <button class="reset-btn" id="resetViewBtn">Сбросить вид</button>
    </div>
    <div class="legend">
        <span class="legend-item"><span class="legend-color polygon"></span> Ворота</span>

            ]},
            { id: 23, vertices: [

                {x: 8319.9492537531, y: 390626.60686334},

            ]},
            { id: 24, vertices: [
                {x: 8701.5541488573, y: 390522.7914285},
                {x: 8696.8890194887, y: 390528.19315724},
                {x: 8732.4913225645, y: 390556.23304008},
                {x: 8736.9109188084, y: 390551.02773784}
            ]},
            { id: 25, vertices: [
                {x: 8382.2063912548, y: 390366.22057466},
                {x: 8401.9925277846, y: 390400.52638849},
                {x: 8408.2791677268, y: 390397.25107146},
                {x: 8388.1440220044, y: 390362.75285512}
            ]}
        ];

        const pylons = [
            { id: 1, x: 8404.7200186063, y: 390391.27657439 },
            { id: 2, x: 8391.7456014453, y: 390368.65158806 },
            { id: 3, x: 8040.0509812536, y: 390373.21715227 },
            { id: 4, x: 7908.0346183769, y: 390221.13447099 },
            { id: 5, x: 7775.8845756935, y: 390068.13157914 },
            { id: 6, x: 7682.141531642, y: 389725.76444543 },
            { id: 7, x: 7660.0856384436, y: 389739.55325382 },
            { id: 8, x: 7451.4311836819, y: 389457.34337015 },
            { id: 9, x: 7429.443026769, y: 389471.13761512 },
            { id: 10, x: 8331.5418506937, y: 390595.24354031 },
            { id: 11, x: 8317.5441643645, y: 390617.29403058 },
            { id: 12, x: 8702.4835761161, y: 390532.31401576 }
        ];

        // ============================================================
        //  Состояние камеры
        // ============================================================

        const state = {
            rotation: 0,
            scale: 1,
            offsetX: 0,
            offsetY: 0,
            baseScale: 1,
        };

        const canvas = document.getElementById('trackCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        let allPoints = [];
        gates.forEach(g => g.vertices.forEach(v => allPoints.push({x: v.x, z: v.y})));
        pylons.forEach(p => allPoints.push({x: p.x, z: p.y}));

        const minX = Math.min(...allPoints.map(p => p.x));
        const maxX = Math.max(...allPoints.map(p => p.x));
        const minZ = Math.min(...allPoints.map(p => p.z));
        const maxZ = Math.max(...allPoints.map(p => p.z));

        const rangeX = maxX - minX;
        const rangeZ = maxZ - minZ;

        const margin = 100;
        const drawW = W - 2 * margin;
        const drawH = H - 2 * margin;
        const cosA = 0.8;
        const sinA = 0.6;
        const approxWidth = (rangeX + rangeZ) * cosA;
        const approxHeight = (rangeX + rangeZ) * sinA;
        state.baseScale = Math.min(drawW / approxWidth, drawH / approxHeight);

        const centerX = (minX + maxX) / 2;
        const centerZ = (minZ + maxZ) / 2;

        function isoProject(x, z, height = 0) {
            let dx = x - centerX;
            let dz = z - centerZ;

            const rot = state.rotation;
            const cosR = Math.cos(rot);
            const sinR = Math.sin(rot);
            const rx = dx * cosR - dz * sinR;
            const rz = dx * sinR + dz * cosR;

            const screenX = (rx - rz) * cosA * state.baseScale * state.scale + W/2 + state.offsetX;
            const screenY = (rx + rz) * sinA * state.baseScale * state.scale - height * state.baseScale * state.scale + H/2 + state.offsetY;

            return { x: screenX, y: screenY };
        }

        // ============================================================
        //  Управление мышью
        // ============================================================

        let isPanning = false;
        let isRotating = false;
        let prevMouseX = 0, prevMouseY = 0;

        const wrapper = document.getElementById('canvasWrapper');

        wrapper.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isPanning = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                wrapper.style.cursor = 'grabbing';
            } else if (e.button === 2) {
                isRotating = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                wrapper.style.cursor = 'grabbing';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                const dx = e.clientX - prevMouseX;
                const dy = e.clientY - prevMouseY;
                state.offsetX += dx;
                state.offsetY += dy;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                render();
            } else if (isRotating) {
                const dx = e.clientX - prevMouseX;
                state.rotation += dx * 0.01;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                render();
            }
        });

        window.addEventListener('mouseup', () => {
            if (isPanning || isRotating) {
                isPanning = false;
                isRotating = false;
                wrapper.style.cursor = 'grab';
            }
        });

        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            state.scale = Math.min(Math.max(state.scale * delta, 0.2), 5);
            render();
        }, { passive: false });

        wrapper.addEventListener('dblclick', resetView);
        document.getElementById('resetViewBtn').addEventListener('click', resetView);

        function resetView() {
            state.rotation = 0;
            state.scale = 1;
            state.offsetX = 0;
            state.offsetY = 0;
            render();
        }

        wrapper.addEventListener('contextmenu', (e) => e.preventDefault());

        // ============================================================
        //  Рендеринг
        // ============================================================

        function render() {
            ctx.clearRect(0, 0, W, H);

            // Сетка
            ctx.strokeStyle = 'rgba(102,204,255,0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < 10; i++) {
                const t = i / 9;
                const x = minX + t * rangeX;
                const z = minZ + t * rangeZ;
                const p1 = isoProject(x, minZ);
                const p2 = isoProject(x, maxZ);
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
                const p3 = isoProject(minX, z);
                const p4 = isoProject(maxX, z);
                ctx.beginPath();
                ctx.moveTo(p3.x, p3.y);
                ctx.lineTo(p4.x, p4.y);
                ctx.stroke();
            }

            // Ворота
            gates.forEach(g => {
                const pts = g.vertices.map(v => isoProject(v.x, v.y, 0));
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) {
                    ctx.lineTo(pts[i].x, pts[i].y);
                }
                ctx.closePath();
                ctx.strokeStyle = '#66ccff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = 'rgba(102,204,255,0.08)';
                ctx.fill();
            });

            // Пилоны – конусы
            const coneHeight = 25;
            const coneRadius = 4.5;

            pylons.forEach(p => {
                const baseCenter = isoProject(p.x, p.y, 0);
                const tip = isoProject(p.x, p.y, coneHeight);

                const r = coneRadius * state.baseScale * state.scale;
                const rx = r;
                const ry = r * 0.5;

                ctx.beginPath();
                ctx.ellipse(baseCenter.x, baseCenter.y, rx, ry, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#661122';
                ctx.fill();
                ctx.strokeStyle = '#ff4466';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const left = { x: baseCenter.x - rx, y: baseCenter.y };
                const right = { x: baseCenter.x + rx, y: baseCenter.y };
                ctx.beginPath();
                ctx.moveTo(tip.x, tip.y);
                ctx.lineTo(left.x, left.y);
                ctx.lineTo(right.x, right.y);
                ctx.closePath();
                ctx.fillStyle = 'rgba(255,68,102,0.25)';
                ctx.fill();
                ctx.strokeStyle = '#ff4466';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const angleStep = Math.PI / 6;
                for (let ang = 0; ang < Math.PI * 2; ang += angleStep) {
                    const ex = baseCenter.x + rx * Math.cos(ang);
                    const ey = baseCenter.y + ry * Math.sin(ang);
                    ctx.beginPath();
                    ctx.moveTo(tip.x, tip.y);
                    ctx.lineTo(ex, ey);
                    ctx.strokeStyle = 'rgba(255,68,102,0.3)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(tip.x, tip.y, 3, 0, 2 * Math.PI);
                ctx.fillStyle = '#ff4466';
                ctx.fill();
            });

            // ============================================================
            //  Подписи (полностью скопированы из Pashkovsky1.html)
            // ============================================================

            const gateCenters = gates.map(g => {
                let cx = 0, cz = 0;
                g.vertices.forEach(v => { cx += v.x; cz += v.y; });
                cx /= g.vertices.length;
                cz /= g.vertices.length;
                return { id: g.id, x: cx, z: cz };
            });

            const centersById = {};
            gateCenters.forEach(gc => { centersById[gc.id] = gc; });

            const labelOffset = 20;

            function drawLabel(cx, cz, text, color, baseline, offset, fontSize) {
                const pos = isoProject(cx, cz, 0);
                ctx.textAlign = 'center';
                ctx.textBaseline = baseline;
                ctx.fillStyle = color;
                ctx.font = fontSize || 'bold 16px Arial';
                ctx.fillText(text, pos.x, pos.y + offset);
            }

            // Объединённые пары первого круга (красные, сверху)
            const mergedFirst = [
                [2, 10],
                [3, 9],
                [4, 8],
                [5, 7]
            ];
            mergedFirst.forEach(([id1, id2]) => {
                const c1 = centersById[id1];
                const c2 = centersById[id2];
                if (c1 && c2) {
                    const midX = (c1.x + c2.x) / 2;
                    const midY = (c1.z + c2.z) / 2;
                    drawLabel(midX, midY, id1 + ', ' + id2, '#ff4466', 'bottom', -labelOffset);
                }
            });

            // Объединённые пары второго круга (синие, снизу)
            const mergedSecond = [
                [14, 22],
                [15, 21],
                [16, 20],
                [17, 19]
            ];
            mergedSecond.forEach(([id1, id2]) => {
                const c1 = centersById[id1];
                const c2 = centersById[id2];
                if (c1 && c2) {
                    const midX = (c1.x + c2.x) / 2;
                    const midY = (c1.z + c2.z) / 2;
                    drawLabel(midX, midY, id1 + ', ' + id2, '#4488ff', 'top', labelOffset);
                }
            });

            // Номера, которые теперь объединены и не должны выводиться отдельно
            const skipIds = new Set([
                2,3,4,5,7,8,9,10,   // первый круг
                14,15,16,17,19,20,21,22 // второй круг
            ]);

            // Остальные подписи
            gateCenters.forEach(gc => {
                const id = gc.id;
                if (skipIds.has(id)) return;

                let text = id.toString();
                let color = '#88ddff';
                let baseline = 'bottom';
                let offset = -labelOffset;
                let fontSize = 'bold 16px Arial';

                // Специальная обработка для СТАРТ и ФИНИШ
                if (id === 1) {
                    text = 'СТАРТ';
                    color = '#ff4466';
                    baseline = 'bottom';
                    offset = -labelOffset - 6;
                    fontSize = 'bold 18px Arial';
                } else if (id === 25) {
                    text = 'ФИНИШ';
                    color = '#4488ff';
                    baseline = 'top';
                    offset = labelOffset + 22;
                    fontSize = 'bold 18px Arial';
                } else {
                    // Общие правила для остальных ворот
                    if (id >= 1 && id <= 8) {
                        color = '#ff4466';
                        baseline = 'bottom';
                        offset = -labelOffset;
                    } else if (id >= 9 && id <= 16) {
                        if (id === 13) {
                            color = '#ffffff';
                        } else {
                            color = '#4488ff';
                        }
                        baseline = 'top';
                        offset = labelOffset;
                    } else if (id >= 17 && id <= 25) {
                        color = '#4488ff';
                        baseline = 'top';
                        offset = labelOffset;
                    }
                    // Для 11 и 12 – красные сверху
                    if (id === 11 || id === 12) {
                        color = '#ff4466';
                        baseline = 'bottom';
                        offset = -labelOffset;
                    }
                }

                drawLabel(gc.x, gc.z, text, color, baseline, offset, fontSize);
            });

            // Информация о масштабе
            ctx.fillStyle = '#556677';
            ctx.font = '11px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`Масштаб: ${(state.scale * state.baseScale).toFixed(3)}`, 15, H - 10);
        }

        resetView();
        console.log('Pashkovsky interactive ready');
    </script>
</body>
</html>
