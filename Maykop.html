            {time:137.100, x:-26551.790, y:256.759, z:461525.952, speed_ms:67.33, speed_kmh:242.40, roll:25.55, pitch:56.67},
            {time:137.400, x:-26542.746, y:260.743, z:461508.398, speed_ms:67.01, speed_kmh:241.22, roll:22.99, pitch:56.00},
            {time:137.700, x:-26533.131, y:264.300, z:461491.163, speed_ms:66.72, speed_kmh:240.19, roll:20.77, pitch:54.00},

            {time:138.300, x:-26512.159, y:270.480, z:461457.822, speed_ms:66.26, speed_kmh:238.54, roll:15.09, pitch:43.41},
            {time:138.600, x:-26500.876, y:273.272, z:461441.733, speed_ms:66.08, speed_kmh:237.88, roll:12.34, pitch:35.61},
            {time:138.900, x:-26489.197, y:275.911, z:461425.966, speed_ms:65.92, speed_kmh:237.30, roll:9.94, pitch:25.50},
            {time:139.200, x:-26477.251, y:278.380, z:461410.427, speed_ms:65.79, speed_kmh:236.84, roll:8.51, pitch:14.81},
            {time:139.500, x:-26465.147, y:280.687, z:461395.026, speed_ms:65.70, speed_kmh:236.52, roll:7.85, pitch:4.70},
            {time:139.800, x:-26452.975, y:282.865, z:461379.687, speed_ms:65.66, speed_kmh:236.37, roll:7.64, pitch:-1.32},
            {time:140.100, x:-26440.799, y:284.951, z:461364.350, speed_ms:65.64, speed_kmh:236.29, roll:7.77, pitch:-3.10},
            {time:140.400, x:-26428.666, y:287.011, z:461348.983, speed_ms:65.62, speed_kmh:236.22, roll:7.99, pitch:-3.53},
            {time:140.700, x:-26416.602, y:289.092, z:461333.572, speed_ms:65.59, speed_kmh:236.13, roll:8.00, pitch:-3.48},
            {time:141.000, x:-26404.613, y:291.189, z:461318.115, speed_ms:65.57, speed_kmh:236.04, roll:7.99, pitch:-3.27},
            {time:141.300, x:-26392.693, y:293.291, z:461302.615, speed_ms:65.54, speed_kmh:235.94, roll:8.02, pitch:-2.97},
            {time:141.600, x:-26380.833, y:295.398, z:461287.079, speed_ms:65.52, speed_kmh:235.86, roll:8.04, pitch:-2.61},
            {time:141.900, x:-26369.022, y:297.508, z:461271.516, speed_ms:65.49, speed_kmh:235.76, roll:8.04, pitch:-2.18}
        ];

        // ============================================================
        //  КАМЕРА, ПРОЕКЦИЯ, УПРАВЛЕНИЕ (коэффициент высоты 0.125)
        // ============================================================

        const canvas = document.getElementById('trackCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        let allPoints = [];
        gates.forEach(g => g.vertices.forEach(v => allPoints.push({x: v.x, z: v.y})));
        pylons.forEach(p => allPoints.push({x: p.x, z: p.y}));
        trackData.forEach(t => allPoints.push({x: t.x, z: t.z}));

        const minX = Math.min(...allPoints.map(p => p.x));
        const maxX = Math.max(...allPoints.map(p => p.x));
        const minZ = Math.min(...allPoints.map(p => p.z));
        const maxZ = Math.max(...allPoints.map(p => p.z));

        const rangeX = maxX - minX;
        const rangeZ = maxZ - minZ;

        const margin = 100;
        const drawW = W - 2 * margin;
        const drawH = H - 2 * margin;
        const cosA = 0.8;
        const sinA = 0.6;
        const approxWidth = (rangeX + rangeZ) * cosA;
        const approxHeight = (rangeX + rangeZ) * sinA;
        let baseScale = Math.min(drawW / approxWidth, drawH / approxHeight);

        const centerX = (minX + maxX) / 2;
        const centerZ = (minZ + maxZ) / 2;

        const state = {
            rotation: 0,
            scale: 1,
            offsetX: 0,
            offsetY: 0,
        };

        function isoProject(x, z, height = 0) {
            let dx = x - centerX;
            let dz = z - centerZ;
            const rot = state.rotation;
            const cosR = Math.cos(rot);
            const sinR = Math.sin(rot);
            const rx = dx * cosR - dz * sinR;
            const rz = dx * sinR + dz * cosR;
            const screenX = (rx - rz) * cosA * baseScale * state.scale + W/2 + state.offsetX;
            const screenY = (rx + rz) * sinA * baseScale * state.scale - height * baseScale * state.scale + H/2 + state.offsetY;
            return { x: screenX, y: screenY };
        }

        // ============================================================
        //  УПРАВЛЕНИЕ КАМЕРОЙ
        // ============================================================

        let isPanning = false, isRotating = false;
        let prevMouseX = 0, prevMouseY = 0;
        const wrapper = document.getElementById('canvasWrapper');

        wrapper.addEventListener('mousedown', (e) => {
            if (e.button === 0) { isPanning = true; prevMouseX = e.clientX; prevMouseY = e.clientY; wrapper.style.cursor = 'grabbing'; }
            else if (e.button === 2) { isRotating = true; prevMouseX = e.clientX; prevMouseY = e.clientY; wrapper.style.cursor = 'grabbing'; }
        });
        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                const dx = e.clientX - prevMouseX, dy = e.clientY - prevMouseY;
                state.offsetX += dx; state.offsetY += dy;
                prevMouseX = e.clientX; prevMouseY = e.clientY;
                render();
            } else if (isRotating) {
                state.rotation += (e.clientX - prevMouseX) * 0.01;
                prevMouseX = e.clientX; prevMouseY = e.clientY;
                render();
            }
        });
        window.addEventListener('mouseup', () => { isPanning = false; isRotating = false; wrapper.style.cursor = 'grab'; });
        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            state.scale = Math.min(Math.max(state.scale * delta, 0.2), 5);
            render();
        }, { passive: false });
        wrapper.addEventListener('dblclick', () => resetView());
        document.getElementById('resetViewBtn')?.addEventListener('click', resetView);
        wrapper.addEventListener('contextmenu', (e) => e.preventDefault());

        function resetView() {
            state.rotation = 0; state.scale = 1; state.offsetX = 0; state.offsetY = 0;
            render();
        }

        // ============================================================
        //  ВСПОМОГАТЕЛЬНЫЕ 3D-ФУНКЦИИ (используем y * 0.125)
        // ============================================================

        function normalize(v) {
            const len = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z);
            if (len === 0) return {x:0, y:0, z:0};
            return {x: v.x/len, y: v.y/len, z: v.z/len};
        }

        function cross(a, b) {
            return {x: a.y*b.z - a.z*b.y, y: a.z*b.x - a.x*b.z, z: a.x*b.y - a.y*b.x};
        }

        function dot(a, b) {
            return a.x*b.x + a.y*b.y + a.z*b.z;
        }

        function vecAdd(a, b) {
            return {x: a.x+b.x, y: a.y+b.y, z: a.z+b.z};
        }

        function vecMul(v, s) {
            return {x: v.x*s, y: v.y*s, z: v.z*s};
        }

        function vecSub(a, b) {
            return {x: a.x-b.x, y: a.y-b.y, z: a.z-b.z};
        }

        function getUpVector(point, nextPoint, rollDeg, pitchDeg) {
            const f = normalize(vecSub(nextPoint, point));
            const wup = {x:0, y:1, z:0};
            let right = normalize(cross(f, wup));
            if (Math.abs(dot(f, wup)) > 0.99) {
                right = {x:1, y:0, z:0};
            }
            let up = cross(right, f);
            const rollRad = rollDeg * Math.PI / 180;
            const pitchRad = pitchDeg * Math.PI / 180;
            const cosR = Math.cos(rollRad);
            const sinR = Math.sin(rollRad);
            const u1 = vecAdd(
                vecMul(up, cosR),
                vecAdd(
                    vecMul(cross(f, up), sinR),
                    vecMul(f, dot(f, up) * (1 - cosR))
                )
            );
            const cosP = Math.cos(pitchRad);
            const sinP = Math.sin(pitchRad);
            const u2 = vecAdd(
                vecMul(u1, cosP),
                vecAdd(
                    vecMul(cross(right, u1), sinP),
                    vecMul(right, dot(right, u1) * (1 - cosP))
                )
            );
            return normalize(u2);
        }

        // ============================================================
        //  АНИМАЦИЯ И УПРАВЛЕНИЕ
        // ============================================================

        let currentTime = 0;
        let isPlaying = false;
        let speedFactor = 1.0;
        let animationId = null;
        let lastTimestamp = 0;
        let totalDuration = trackData[trackData.length-1].time;

        const playBtn = document.getElementById('playBtn');
        const resetBtn = document.getElementById('resetBtn');
        const timeSlider = document.getElementById('timeSlider');
        const timeDisplay = document.getElementById('timeDisplay');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const currentTimeSpan = document.getElementById('currentTime');
        const currentSpeedSpan = document.getElementById('currentSpeed');
        const currentRollSpan = document.getElementById('currentRoll');
        const currentPitchSpan = document.getElementById('currentPitch');

        timeSlider.max = totalDuration;
        timeSlider.value = 0;

        function lerp(a, b, t) { return a + (b - a) * t; }

        function getInterpolatedData(time) {
            if (time <= trackData[0].time) return trackData[0];
            if (time >= trackData[trackData.length-1].time) return trackData[trackData.length-1];
            for (let i = 0; i < trackData.length - 1; i++) {
                if (time >= trackData[i].time && time < trackData[i+1].time) {
                    const t = (time - trackData[i].time) / (trackData[i+1].time - trackData[i].time);
                    return {
                        time: time,
                        x: lerp(trackData[i].x, trackData[i+1].x, t),
                        y: lerp(trackData[i].y, trackData[i+1].y, t),
                        z: lerp(trackData[i].z, trackData[i+1].z, t),
                        speed_ms: lerp(trackData[i].speed_ms, trackData[i+1].speed_ms, t),
                        speed_kmh: lerp(trackData[i].speed_kmh, trackData[i+1].speed_kmh, t),
                        roll: lerp(trackData[i].roll, trackData[i+1].roll, t),
                        pitch: lerp(trackData[i].pitch, trackData[i+1].pitch, t),
                    };
                }
            }
            return trackData[0];
        }

        function updateTelemetry(data) {
            if (!data) return;
            currentTimeSpan.textContent = data.time.toFixed(1);
            currentSpeedSpan.textContent = Math.round(data.speed_kmh);
            currentRollSpan.textContent = data.roll.toFixed(1);
            currentPitchSpan.textContent = data.pitch.toFixed(1);
        }

        function render() {
            ctx.clearRect(0, 0, W, H);

            // Сетка
            ctx.strokeStyle = 'rgba(102,204,255,0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < 10; i++) {
                const t = i / 9;
                const x = minX + t * rangeX;
                const z = minZ + t * rangeZ;
                const p1 = isoProject(x, minZ);
                const p2 = isoProject(x, maxZ);
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                const p3 = isoProject(minX, z);
                const p4 = isoProject(maxX, z);
                ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke();
            }

            // Ворота
            gates.forEach(g => {
                const pts = g.vertices.map(v => isoProject(v.x, v.y, 0));
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                ctx.closePath();
                ctx.strokeStyle = '#66ccff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = 'rgba(102,204,255,0.08)';
                ctx.fill();
            });

            // Пилоны
            const coneHeight = 25, coneRadius = 4.5;
            pylons.forEach(p => {
                const base = isoProject(p.x, p.y, 0);
                const tip = isoProject(p.x, p.y, coneHeight);
                const r = coneRadius * baseScale * state.scale;
                const rx = r, ry = r * 0.5;
                ctx.beginPath();
                ctx.ellipse(base.x, base.y, rx, ry, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#661122';
                ctx.fill();
                ctx.strokeStyle = '#ff4466';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(tip.x, tip.y);
                ctx.lineTo(base.x - rx, base.y);
                ctx.lineTo(base.x + rx, base.y);
                ctx.closePath();
                ctx.fillStyle = 'rgba(255,68,102,0.25)';
                ctx.fill();
                ctx.strokeStyle = '#ff4466';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                const angleStep = Math.PI / 6;
                for (let ang = 0; ang < Math.PI * 2; ang += angleStep) {
                    const ex = base.x + rx * Math.cos(ang);
                    const ey = base.y + ry * Math.sin(ang);
                    ctx.beginPath();
                    ctx.moveTo(tip.x, tip.y);
                    ctx.lineTo(ex, ey);
                    ctx.strokeStyle = 'rgba(255,68,102,0.3)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            });

            // Лента траектории (высота уменьшена в 8 раз – коэффициент 0.125)
            if (trackData.length > 1) {
                const totalPoints = trackData.length;
                const halfTime = trackData[totalPoints-1].time / 2;
                const ribbonWidth = 6.0;
                const points3d = trackData.map(p => ({
                    x: p.x,
                    y: p.y * 0.125,   // <-- уменьшено до 0.125
                    z: p.z,
                    time: p.time,
                    roll: p.roll,
                    pitch: p.pitch
                }));

                ctx.shadowColor = 'rgba(255,255,255,0.3)';
                ctx.shadowBlur = 8;

                for (let i = 0; i < points3d.length - 1; i++) {
                    const p0 = points3d[i];
                    const p1 = points3d[i+1];
                    const a = {x: p0.x, y: p0.y, z: p0.z};
                    const b = {x: p1.x, y: p1.y, z: p1.z};
                    const avgRoll = (p0.roll + p1.roll) / 2;
                    const avgPitch = (p0.pitch + p1.pitch) / 2;
                    const upVec = getUpVector(a, b, avgRoll, avgPitch);
                    const offset = vecMul(upVec, ribbonWidth/2);
                    const a_top = vecAdd(a, offset);
                    const a_bot = vecSub(a, offset);
                    const b_top = vecAdd(b, offset);
                    const b_bot = vecSub(b, offset);

                    const pa_top = isoProject(a_top.x, a_top.z, a_top.y);
                    const pa_bot = isoProject(a_bot.x, a_bot.z, a_bot.y);
                    const pb_top = isoProject(b_top.x, b_top.z, b_top.y);
                    const pb_bot = isoProject(b_bot.x, b_bot.z, b_bot.y);

                    const t = (p0.time + p1.time) / 2;
                    const isFirstHalf = t <= halfTime;
                    const r = isFirstHalf ? 255 : 68;
                    const g = isFirstHalf ? 68 : 136;
                    const b_val = isFirstHalf ? 68 : 255;
                    const alpha = 0.5;

                    ctx.beginPath();
                    ctx.moveTo(pa_top.x, pa_top.y);
                    ctx.lineTo(pb_top.x, pb_top.y);
                    ctx.lineTo(pb_bot.x, pb_bot.y);
                    ctx.lineTo(pa_bot.x, pa_bot.y);
                    ctx.closePath();
                    ctx.fillStyle = `rgba(${r}, ${g}, ${b_val}, ${alpha})`;
                    ctx.fill();
                    ctx.strokeStyle = `rgba(${r}, ${g}, ${b_val}, 0.3)`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;

                // Стрелки
                const arrowStep = 20;
                const arrowLen = 12.0;
                const arrowWidth = 4.0;
                for (let i = 0; i < points3d.length - 1; i++) {
                    if (i % arrowStep !== 0) continue;
                    const p0 = points3d[i];
                    const p1 = points3d[Math.min(i+1, points3d.length-1)];
                    const mid = { x: (p0.x+p1.x)/2, y: (p0.y+p1.y)/2, z: (p0.z+p1.z)/2 };
                    const dir = normalize(vecSub(p1, p0));
                    const upVec = getUpVector(
                        {x: p0.x, y: p0.y, z: p0.z},
                        {x: p1.x, y: p1.y, z: p1.z},
                        (p0.roll+p1.roll)/2,
                        (p0.pitch+p1.pitch)/2
                    );
                    const offsetUp = vecMul(upVec, ribbonWidth/2 + 0.5);
                    const origin = vecAdd(mid, offsetUp);
                    const tip = vecAdd(origin, vecMul(dir, arrowLen));
                    const rightDir = normalize(cross(dir, upVec));
                    const left = vecAdd(origin, vecMul(rightDir, -arrowWidth/2));
                    const right = vecAdd(origin, vecMul(rightDir, arrowWidth/2));

                    const pTip = isoProject(tip.x, tip.z, tip.y);
                    const pLeft = isoProject(left.x, left.z, left.y);
                    const pRight = isoProject(right.x, right.z, right.y);

                    ctx.beginPath();
                    ctx.moveTo(pTip.x, pTip.y);
                    ctx.lineTo(pLeft.x, pLeft.y);
                    ctx.lineTo(pRight.x, pRight.y);
                    ctx.closePath();
                    ctx.fillStyle = '#ffff88';
                    ctx.fill();
                    ctx.strokeStyle = '#ffaa00';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }
            }

            // Подписи ворот (как в оригинальном Maykop.html)
            const gateCenters = gates.map(g => {
                let cx = 0, cz = 0;
                g.vertices.forEach(v => { cx += v.x; cz += v.y; });
                cx /= g.vertices.length;
                cz /= g.vertices.length;
                return { id: g.id, x: cx, z: cz };
            });

            const labelOffset = 30;

            for (let i = 1; i <= 8; i++) {
                const small = gateCenters.find(c => c.id === i);
                const big = gateCenters.find(c => c.id === i + 8);
                if (!small || !big) continue;
                const midX = (small.x + big.x) / 2;
                const midZ = (small.z + big.z) / 2;
                const pos = isoProject(midX, midZ, 0);

                let topLabel = '';
                let bottomLabel = '';
                let topColor = '#ff4466';
                let bottomColor = '#4488ff';

                if (i === 1) {
                    topLabel = 'СТАРТ';
                    bottomLabel = '9';
                    bottomColor = '#ffffff';
                } else if (i === 4) {
                    topLabel = '4, 6';
                    bottomLabel = '12, 14';
                } else if (i === 6) {
                    topLabel = '';
                    bottomLabel = '';
                } else {
                    topLabel = i.toString();
                    bottomLabel = (i + 8).toString();
                    if (i + 8 === 9) bottomColor = '#ffffff';
                }

                if (topLabel) {
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillStyle = topColor;
                    ctx.font = (i === 1) ? 'bold 16px Arial' : 'bold 14px Arial';
                    ctx.fillText(topLabel, pos.x, pos.y - labelOffset);
                }
                if (bottomLabel) {
                    ctx.textBaseline = 'top';
                    ctx.fillStyle = bottomColor;
                    ctx.font = 'bold 14px Arial';
                    ctx.fillText(bottomLabel, pos.x, pos.y + labelOffset);
                }
            }

            const finish = gateCenters.find(c => c.id === 17);
            if (finish) {
                const pos = isoProject(finish.x, finish.z, 0);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillStyle = '#4488ff';
                ctx.font = 'bold 16px Arial';
                ctx.fillText('ФИНИШ', pos.x, pos.y + 45);
            }

            // Самолётик (высота также уменьшена в 8 раз)
            if (currentTime >= 0 && currentTime <= totalDuration) {
                const data = getInterpolatedData(currentTime);
                const pos3d = { x: data.x, y: data.y * 0.125, z: data.z };
                let dir = {x:1, y:0, z:0};
                if (currentTime < totalDuration) {
                    const nextData = getInterpolatedData(currentTime + 0.1);
                    dir = normalize(vecSub({x: nextData.x, y: nextData.y*0.125, z: nextData.z}, pos3d));
                }
                const upVec = getUpVector(
                    {x: data.x, y: data.y*0.125, z: data.z},
                    {x: data.x + dir.x, y: data.y*0.125 + dir.y, z: data.z + dir.z},
                    data.roll, data.pitch
                );
                const rightVec = normalize(cross(dir, upVec));

                const center = isoProject(pos3d.x, pos3d.z, pos3d.y);
                const planeScale = 2.5 * baseScale * state.scale;
                const nose = vecAdd(pos3d, vecMul(dir, 5 * planeScale / 5));
                const left = vecAdd(pos3d, vecMul(rightVec, -3 * planeScale / 5));
                const right = vecAdd(pos3d, vecMul(rightVec, 3 * planeScale / 5));
                const tail = vecAdd(pos3d, vecMul(dir, -4 * planeScale / 5));

                const offsetUpPlane = vecMul(upVec, 0.3);
                const pNose = isoProject(nose.x + offsetUpPlane.x, nose.z + offsetUpPlane.z, nose.y + offsetUpPlane.y);
                const pLeft = isoProject(left.x + offsetUpPlane.x, left.z + offsetUpPlane.z, left.y + offsetUpPlane.y);
                const pRight = isoProject(right.x + offsetUpPlane.x, right.z + offsetUpPlane.z, right.y + offsetUpPlane.y);
                const pTail = isoProject(tail.x + offsetUpPlane.x, tail.z + offsetUpPlane.z, tail.y + offsetUpPlane.y);

                ctx.beginPath();
                ctx.moveTo(pNose.x, pNose.y);
                ctx.lineTo(pLeft.x, pLeft.y);
                ctx.lineTo(pTail.x, pTail.y);
                ctx.lineTo(pRight.x, pRight.y);
                ctx.closePath();
                ctx.fillStyle = '#88ddff';
                ctx.fill();
                ctx.strokeStyle = '#66ccff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.shadowColor = 'rgba(102,204,255,0.8)';
                ctx.shadowBlur = 15;
                ctx.strokeStyle = 'rgba(102,204,255,0.3)';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.beginPath();
                ctx.arc(center.x, center.y, 4, 0, 2 * Math.PI);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            ctx.fillStyle = '#556677';
            ctx.font = '11px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`Масштаб: ${(state.scale * baseScale).toFixed(3)}`, 15, H - 10);

            if (currentTime >= 0 && currentTime <= totalDuration) {
                const data = getInterpolatedData(currentTime);
                updateTelemetry(data);
            }
        }

        function updateUI() {
            timeSlider.value = currentTime;
            timeDisplay.textContent = currentTime.toFixed(1) + ' с';
            if (currentTime >= totalDuration) {
                isPlaying = false;
                playBtn.textContent = '▶';
            }
        }

        function animationLoop(timestamp) {
            if (isPlaying) {
                if (!lastTimestamp) lastTimestamp = timestamp;
                const delta = (timestamp - lastTimestamp) / 1000 * speedFactor;
                lastTimestamp = timestamp;
                currentTime += delta;
                if (currentTime > totalDuration) {
                    currentTime = totalDuration;
                    isPlaying = false;
                    playBtn.textContent = '▶';
                }
                render();
                updateUI();
            } else {
                lastTimestamp = 0;
            }
            animationId = requestAnimationFrame(animationLoop);
        }

        playBtn.addEventListener('click', () => {
            if (currentTime >= totalDuration) {
                currentTime = 0;
                render();
                updateUI();
            }
            isPlaying = !isPlaying;
            playBtn.textContent = isPlaying ? '⏸' : '▶';
            if (isPlaying) lastTimestamp = 0;
        });

        resetBtn.addEventListener('click', () => {
            currentTime = 0;
            isPlaying = false;
            playBtn.textContent = '▶';
            render();
            updateUI();
        });

        timeSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            currentTime = Math.min(val, totalDuration);
            if (isPlaying) {
                isPlaying = false;
                playBtn.textContent = '▶';
            }
            render();
            updateUI();
        });

        speedSlider.addEventListener('input', (e) => {
            speedFactor = parseFloat(e.target.value);
            speedValue.textContent = speedFactor.toFixed(1) + '×';
        });

        animationLoop(0);
        resetView();

        console.log('Maykop track with aircraft animation (height /8) ready');
    </script>
</body>
</html>
