<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трасса «Майкоп» — ViRAG (интерактив)</title>
    <style>
        body {
            background: #0a0e1a;
            color: #e0e8f0;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            user-select: none;
        }
        h1 {
            color: #66ccff;
            text-shadow: 0 0 20px rgba(102,204,255,0.3);
            margin-bottom: 5px;
            font-size: 24px;
        }
        .info {
            color: #88ddff;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .canvas-wrapper {
            position: relative;
            border: 1px solid rgba(102,204,255,0.2);
            border-radius: 12px;
            background: #0d1225;
            box-shadow: 0 0 40px rgba(102,204,255,0.05);
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }
        .canvas-wrapper:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 1000px;
            height: 650px;
            max-width: 100%;
            height: auto;
            background: #0d1225;
        }
        .controls-hint {
            margin-top: 10px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 12px;
            color: #88ddff;
            opacity: 0.7;
        }
        .controls-hint span {
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 12px;
        }
        .reset-btn {
            background: rgba(102,204,255,0.15);
            border: 1px solid #66ccff;
            color: #66ccff;
            padding: 4px 16px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .reset-btn:hover {
            background: rgba(102,204,255,0.3);
        }
        .legend {
            margin-top: 10px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 13px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-color { width: 20px; height: 4px; border-radius: 2px; }
        .legend-color.polygon { background: #66ccff; }
        .legend-color.pylon {
            display: inline-block;
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 16px solid #ff4466;
        }
        .footer {
            margin-top: 10px;
            color: #556677;
            font-size: 12px;
        }
        @media (max-width: 1024px) {
            canvas { width: 100%; height: auto; }
        }
    </style>
</head>
<body>
    <h1>✈️ Трасса «Майкоп»</h1>
    <div class="info">17 ворот · 12 пилонов</div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="trackCanvas" width="1000" height="650"></canvas>
    </div>
    <div class="controls-hint">
        <span>🖱 ЛКМ + drag = панорамирование</span>
        <span>🔄 ПКМ + drag = вращение</span>
        <span>🔍 Колесо = масштаб</span>
        <span>🔄 Двойной клик = сброс</span>
        <button class="reset-btn" id="resetViewBtn">Сбросить вид</button>
    </div>
    <div class="legend">
        <span class="legend-item"><span class="legend-color polygon"></span> Ворота</span>
        <span class="legend-item"><span class="legend-color pylon"></span> Пилоны (конусы)</span>
        <span class="legend-item"><span style="color:#88ddff;">Цифры</span> — номера ворот</span>
        <span class="legend-item"><span style="color:#ff4466;">Круг-1</span>
        <span class="legend-item"><span style="color:#4488ff;">Круг-2</span>
    </div>
    <div class="footer">Данные из миссии ViRAG</div>

    <script>
        // ============================================================
        //  Данные трассы «Майкоп»
        // ============================================================

        const gates = [
            { id: 1, vertices: [
                {x: -26547.327943895, y: 461806.40748165},
                {x: -26580.398408549, y: 461829.18242429},
                {x: -26576.155405537, y: 461834.67336937},

            ]},

            { id: 3, vertices: [

            ]},
            { id: 5, vertices: [
                {x: -25636.314225192, y: 463073.59732097},
                {x: -25668.221347498, y: 463098.96077921},
                {x: -25663.516398955, y: 463104.20652643},

            ]},
            { id: 6, vertices: [
                {x: -25875.993044356, y: 462747.15266251},
                {x: -25908.238067313, y: 462771.77613459},
                {x: -25903.547882156, y: 462777.40435677},
                {x: -25871.830505029, y: 462752.60500275}
            ]},
            { id: 7, vertices: [
                {x: -25996.631034793, y: 462341.68831728},
                {x: -26025.289529012, y: 462383.05824038},
                {x: -26019.627165235, y: 462387.10278594},

            ]},
            { id: 8, vertices: [
                {x: -26390.410622395, y: 462194.18696772},
                {x: -26415.369128824, y: 462226.36875954},
                {x: -26409.672716769, y: 462230.59702416},
                {x: -26385.007839826, y: 462198.59141003}
            ]},
            { id: 9, vertices: [
                {x: -26547.265546792, y: 461806.34508455},
                {x: -26580.398408549, y: 461829.12002719},
                {x: -26576.093008434, y: 461834.61097227},
                {x: -26543.272132192, y: 461812.08561804}
            ]},
            { id: 10, vertices: [
                {x: -26231.87684762, y: 462084.78776632},
                {x: -26257.042420497, y: 462116.23020264},
                {x: -26251.346748114, y: 462120.12418273},
                {x: -26226.413651661, y: 462089.08858016}
            ]},
            { id: 11, vertices: [
                {x: -26211.911247081, y: 462503.19627066},
                {x: -26243.758570456, y: 462542.51920621},
                {x: -26237.923946326, y: 462547.19906098},
                {x: -26206.745173632, y: 462507.8153481}
            ]},
            { id: 12, vertices: [
                {x: -25871.830505029, y: 462752.60500275},
                {x: -25903.430627527, y: 462777.46298409},
                {x: -25898.916324313, y: 462782.50493313},
                {x: -25867.667965702, y: 462758.29185226}
            ]},
            { id: 13, vertices: [
                {x: -25636.314225192, y: 463073.5432411},
                {x: -25668.16726763, y: 463098.96077921},
                {x: -25663.462319086, y: 463104.20652643},
                {x: -25631.933755858, y: 463079.27570714}
            ]},
            { id: 14, vertices: [
                {x: -25875.993044356, y: 462747.09403519},
                {x: -25908.179439999, y: 462771.77613459},
                {x: -25903.60650947, y: 462777.46298409},
                {x: -25871.771877714, y: 462752.60500275}
            ]},
            { id: 15, vertices: [
                {x: -25996.688814015, y: 462341.63053805},
                {x: -26025.23174979, y: 462383.00046116},
                {x: -26019.569386013, y: 462387.10278594},
                {x: -25990.968671016, y: 462345.50174594}
            ]},
            { id: 16, vertices: [
                {x: -26390.351896497, y: 462194.18696772},
                {x: -26415.369128824, y: 462226.31003365},
                {x: -26409.672716769, y: 462230.53829826},
                {x: -26384.890388031, y: 462198.53268414}
            ]},
            { id: 17, vertices: [
                {x: -26584.579014458, y: 461823.3794937},
                {x: -26580.460805652, y: 461829.2448214},
                {x: -26547.390340998, y: 461806.34508455},
                {x: -26551.508549804, y: 461800.79174237}
            ]}
        ];

        const pylons = [
            { id: 1, x: -26574.671405716, y: 461825.09529038 },
            { id: 2, x: -26553.012793214, y: 461810.27091527 },
            { id: 3, x: -26252.590996836, y: 462110.74194777 },
            { id: 4, x: -26236.313741172, y: 462090.31958411 },
            { id: 5, x: -26216.235989401, y: 462508.57717618 },
            { id: 6, x: -25897.869376505, y: 462772.94679359 },
            { id: 7, x: -25877.193479529, y: 462756.87482061 },
            { id: 8, x: -25662.45929842, y: 463094.50460252 },
            { id: 9, x: -25641.646427999, y: 463077.92677674 },
            { id: 10, x: -26015.59766822, y: 462381.41073035 },
            { id: 11, x: -26405.3112871, y: 462225.04150647 },
            { id: 12, x: -26389.231836427, y: 462204.09247766 }
        ];

        // ============================================================
        //  Состояние камеры
        // ============================================================

        const state = {
            rotation: 0,
            scale: 1,
            offsetX: 0,
            offsetY: 0,
            baseScale: 1,
        };

        const canvas = document.getElementById('trackCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        let allPoints = [];
        gates.forEach(g => g.vertices.forEach(v => allPoints.push({x: v.x, z: v.y})));
        pylons.forEach(p => allPoints.push({x: p.x, z: p.y}));

        const minX = Math.min(...allPoints.map(p => p.x));
        const maxX = Math.max(...allPoints.map(p => p.x));
        const minZ = Math.min(...allPoints.map(p => p.z));
        const maxZ = Math.max(...allPoints.map(p => p.z));

        const rangeX = maxX - minX;
        const rangeZ = maxZ - minZ;

        const margin = 100;
        const drawW = W - 2 * margin;
        const drawH = H - 2 * margin;
        const cosA = 0.8;
        const sinA = 0.6;
        const approxWidth = (rangeX + rangeZ) * cosA;
        const approxHeight = (rangeX + rangeZ) * sinA;
        state.baseScale = Math.min(drawW / approxWidth, drawH / approxHeight);

        const centerX = (minX + maxX) / 2;
        const centerZ = (minZ + maxZ) / 2;

        function isoProject(x, z, height = 0) {
            let dx = x - centerX;
            let dz = z - centerZ;

            const rot = state.rotation;
            const cosR = Math.cos(rot);
            const sinR = Math.sin(rot);
            const rx = dx * cosR - dz * sinR;
            const rz = dx * sinR + dz * cosR;

            const screenX = (rx - rz) * cosA * state.baseScale * state.scale + W/2 + state.offsetX;
            const screenY = (rx + rz) * sinA * state.baseScale * state.scale - height * state.baseScale * state.scale + H/2 + state.offsetY;

            return { x: screenX, y: screenY };
        }

        // ============================================================
        //  Управление мышью
        // ============================================================

        let isPanning = false;
        let isRotating = false;
        let prevMouseX = 0, prevMouseY = 0;

        const wrapper = document.getElementById('canvasWrapper');

        wrapper.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isPanning = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                wrapper.style.cursor = 'grabbing';
            } else if (e.button === 2) {
                isRotating = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                wrapper.style.cursor = 'grabbing';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                const dx = e.clientX - prevMouseX;
                const dy = e.clientY - prevMouseY;
                state.offsetX += dx;
                state.offsetY += dy;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                render();
            } else if (isRotating) {
                const dx = e.clientX - prevMouseX;
                state.rotation += dx * 0.01;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                render();
            }
        });

        window.addEventListener('mouseup', () => {
            if (isPanning || isRotating) {
                isPanning = false;
                isRotating = false;
                wrapper.style.cursor = 'grab';
            }
        });

        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            state.scale = Math.min(Math.max(state.scale * delta, 0.2), 5);
            render();
        }, { passive: false });

        wrapper.addEventListener('dblclick', resetView);
        document.getElementById('resetViewBtn').addEventListener('click', resetView);

        function resetView() {
            state.rotation = 0;
            state.scale = 1;
            state.offsetX = 0;
            state.offsetY = 0;
            render();
        }

        wrapper.addEventListener('contextmenu', (e) => e.preventDefault());

        // ============================================================
        //  Рендеринг
        // ============================================================

        function render() {
            ctx.clearRect(0, 0, W, H);

            // Сетка
            ctx.strokeStyle = 'rgba(102,204,255,0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < 10; i++) {
                const t = i / 9;
                const x = minX + t * rangeX;
                const z = minZ + t * rangeZ;
                const p1 = isoProject(x, minZ);
                const p2 = isoProject(x, maxZ);
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
                const p3 = isoProject(minX, z);
                const p4 = isoProject(maxX, z);
                ctx.beginPath();
                ctx.moveTo(p3.x, p3.y);
                ctx.lineTo(p4.x, p4.y);
                ctx.stroke();
            }

            // Ворота
            gates.forEach(g => {
                const pts = g.vertices.map(v => isoProject(v.x, v.y, 0));
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) {
                    ctx.lineTo(pts[i].x, pts[i].y);
                }
                ctx.closePath();
                ctx.strokeStyle = '#66ccff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = 'rgba(102,204,255,0.08)';
                ctx.fill();
            });

            // Пилоны – конусы
            const coneHeight = 25;
            const coneRadius = 4.5;

            pylons.forEach(p => {
                const baseCenter = isoProject(p.x, p.y, 0);
                const tip = isoProject(p.x, p.y, coneHeight);

                const r = coneRadius * state.baseScale * state.scale;
                const rx = r;
                const ry = r * 0.5;

                ctx.beginPath();
                ctx.ellipse(baseCenter.x, baseCenter.y, rx, ry, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#661122';
                ctx.fill();
                ctx.strokeStyle = '#ff4466';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const left = { x: baseCenter.x - rx, y: baseCenter.y };
                const right = { x: baseCenter.x + rx, y: baseCenter.y };
                ctx.beginPath();
                ctx.moveTo(tip.x, tip.y);
                ctx.lineTo(left.x, left.y);
                ctx.lineTo(right.x, right.y);
                ctx.closePath();
                ctx.fillStyle = 'rgba(255,68,102,0.25)';
                ctx.fill();
                ctx.strokeStyle = '#ff4466';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const angleStep = Math.PI / 6;
                for (let ang = 0; ang < Math.PI * 2; ang += angleStep) {
                    const ex = baseCenter.x + rx * Math.cos(ang);
                    const ey = baseCenter.y + ry * Math.sin(ang);
                    ctx.beginPath();
                    ctx.moveTo(tip.x, tip.y);
                    ctx.lineTo(ex, ey);
                    ctx.strokeStyle = 'rgba(255,68,102,0.3)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(tip.x, tip.y, 3, 0, 2 * Math.PI);
                ctx.fillStyle = '#ff4466';
                ctx.fill();
            });

            // Подписи ворот (с особыми правилами)
            const gateCenters = gates.map(g => {
                let cx = 0, cz = 0;
                g.vertices.forEach(v => { cx += v.x; cz += v.y; });
                cx /= g.vertices.length;
                cz /= g.vertices.length;
                return { id: g.id, x: cx, z: cz };
            });

            const labelOffset = 30;

            for (let i = 1; i <= 8; i++) {
                const small = gateCenters.find(c => c.id === i);
                const big = gateCenters.find(c => c.id === i + 8);
                if (!small || !big) continue;
                const midX = (small.x + big.x) / 2;
                const midZ = (small.z + big.z) / 2;
                const pos = isoProject(midX, midZ, 0);

                let topLabel = '';
                let bottomLabel = '';
                let topColor = '#ff4466';
                let bottomColor = '#4488ff';

                // Особые случаи
                if (i === 1) {
                    topLabel = 'СТАРТ';
                    bottomLabel = '9';
                    bottomColor = '#ffffff';
                } else if (i === 4) {
                    topLabel = '4, 6';
                    bottomLabel = '12, 14';
                } else if (i === 6) {
                    topLabel = '';
                    bottomLabel = '';
                } else {
                    topLabel = i.toString();
                    bottomLabel = (i + 8).toString();
                    if (i + 8 === 9) bottomColor = '#ffffff';
                }

                // Верхняя подпись
                if (topLabel) {
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillStyle = topColor;
                    ctx.font = (i === 1) ? 'bold 16px Arial' : 'bold 14px Arial';
                    ctx.fillText(topLabel, pos.x, pos.y - labelOffset);
                }

                // Нижняя подпись
                if (bottomLabel) {
                    ctx.textBaseline = 'top';
                    ctx.fillStyle = bottomColor;
                    ctx.font = 'bold 14px Arial';
                    ctx.fillText(bottomLabel, pos.x, pos.y + labelOffset);
                }
            }

            // Финиш (ворота 17)
            const finish = gateCenters.find(c => c.id === 17);
            if (finish) {
                const pos = isoProject(finish.x, finish.z, 0);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillStyle = '#4488ff';
                ctx.font = 'bold 16px Arial';
                ctx.fillText('ФИНИШ', pos.x, pos.y + 45);
            }

            // Информация о масштабе
            ctx.fillStyle = '#556677';
            ctx.font = '11px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`Масштаб: ${(state.scale * state.baseScale).toFixed(3)}`, 15, H - 10);
        }

        resetView();
        console.log('Maykop interactive ready');
    </script>
