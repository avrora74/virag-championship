<head>
    <meta charset="UTF-8">

    <style>
        body {
            background: #0a0e1a;
            color: #e0e8f0;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #66ccff;
            text-shadow: 0 0 20px rgba(102,204,255,0.3);
            margin-bottom: 10px;
        }
        .info {
            color: #88ddff;
            margin-bottom: 20px;
            font-size: 14px;
        }
        canvas {
            border: 1px solid rgba(102,204,255,0.2);
            border-radius: 12px;
            background: #0d1225;
            box-shadow: 0 0 40px rgba(102,204,255,0.05);
            max-width: 100%;
            height: auto;
        }
        .legend {
            margin-top: 15px;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 14px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-color {
            width: 20px;
            height: 4px;
            border-radius: 2px;
        }
        .legend-color.polygon { background: #66ccff; }
        .legend-color.pylon { background: #ff4466; width: 12px; height: 12px; border-radius: 50%; }
        .legend-color.red { background: #ff4466; }
        .legend-color.blue { background: #4488ff; }
        .footer {
            margin-top: 20px;
            color: #556677;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <h1>✈️ Трасса «Анапа»</h1>
    <div class="info">17 ворот · 12 пилонов · вид сверху</div>
    <canvas id="trackCanvas" width="1000" height="700"></canvas>
    <div class="legend">
        <span class="legend-item"><span class="legend-color polygon"></span> Ворота (полигоны)</span>
        <span class="legend-item"><span class="legend-color pylon"></span> Пилоны</span>
        <span class="legend-item"><span style="color:#88ddff;">Цифры</span> — номера ворот</span>
        <span class="legend-item"><span class="legend-color red"></span> 1 круг</span>
        <span class="legend-item"><span class="legend-color blue"></span> 2 круг</span>
    </div>
    <div class="footer">Данные из миссии ViRAG · масштабировано автоматически</div>

    <script>
        // ============================================================
        //  Данные трассы (извлечены из mission.txt)
        // ============================================================

        const gates = [
            { id: 1, vertices: [
                {x: -6381.1129413424, y: 240324.94226134},

            { id: 4, vertices: [

            { id: 9, vertices: [
                {x: -6381.1129413424, y: 240325.00092222},
                {x: -6379.2944540157, y: 240365.18362605},
                {x: -6372.2551482349, y: 240364.714339},

            { id: 10, vertices: [

            ]},
            { id: 11, vertices: [

                {x: -5793.0406785231, y: 240421.21774357},
                {x: -5800.2530321714, y: 240422.11928778},

            ]},
            { id: 12, vertices: [
                {x: -5555.4784881835, y: 240394.06583526},
                {x: -5557.2991777161, y: 240440.72943365},
                {x: -5550.1512854773, y: 240440.99916543},
                {x: -5548.3980288904, y: 240394.67273177}
            ]},
            { id: 13, vertices: [
                {x: -5256.3984063529, y: 240202.27126776},
                {x: -5245.2136148422, y: 240240.92747701},
                {x: -5238.1495359933, y: 240238.89982475},
                {x: -5249.2689193665, y: 240200.50524804}
            ]},
            { id: 14, vertices: [
                {x: -5699.0814846166, y: 240098.87598497},
                {x: -5699.4428595098, y: 240138.48267327},
                {x: -5692.2876366236, y: 240138.48267327},
                {x: -5691.998536709, y: 240098.87598497}
            ]},
            { id: 15, vertices: [
                {x: -5990.3300597895, y: 239896.85385218},
                {x: -5995.6451237013, y: 239944.12725717},
                {x: -5988.7457618928, y: 239944.89385292},
                {x: -5983.3795915973, y: 239897.72266071}
            ]},
            { id: 16, vertices: [
                {x: -6342.704204288, y: 239947.5912616},
                {x: -6340.9581931406, y: 239986.93471279},
                {x: -6333.7413470649, y: 239986.64371093},
                {x: -6335.4873582123, y: 239947.24205938}
            ]},
            { id: 17, vertices: [
                {x: -6381.1129413424, y: 240324.88360045},
                {x: -6379.3531148972, y: 240365.18362605},
                {x: -6372.2551482349, y: 240364.714339},
                {x: -6373.9563137986, y: 240324.76627869}
            ]}
        ];

        const pylons = [
            { id: 1, x: -6379.5946325629, y: 240358.1835623 },
            { id: 2, x: -6380.6916578947, y: 240331.88752083 },
            { id: 3, x: -6043.4298960764, y: 240441.40088616 },
            { id: 4, x: -5800.926763856, y: 240415.21532217 },
            { id: 5, x: -5555.6055302239, y: 240401.00609776 },
            { id: 6, x: -5246.8982662227, y: 240234.16789778 },
            { id: 7, x: -5254.1438890772, y: 240208.86912341 },
            { id: 8, x: -5692.2961470541, y: 240131.49182578 },
            { id: 9, x: -5692.0385861089, y: 240105.88799778 },
            { id: 10, x: -5987.9869655225, y: 239937.90757653 },
            { id: 11, x: -6334.1662080195, y: 239979.6565022 },
            { id: 12, x: -6335.2868346986, y: 239954.22427357 }
        ];

        // ============================================================
        //  Отрисовка
        // ============================================================

        const canvas = document.getElementById('trackCanvas');
        const ctx = canvas.getContext('2d');

        let allPoints = [];
        gates.forEach(g => {
            g.vertices.forEach(v => {
                allPoints.push({x: v.x, y: v.y});
            });
        });
        pylons.forEach(p => {
            allPoints.push({x: p.x, y: p.y});
        });

        const minX = Math.min(...allPoints.map(p => p.x));
        const maxX = Math.max(...allPoints.map(p => p.x));
        const minY = Math.min(...allPoints.map(p => p.y));
        const maxY = Math.max(...allPoints.map(p => p.y));

        const rangeX = maxX - minX;
        const rangeY = maxY - minY;

        const marginTop = 80;
        const marginBottom = 120;
        const marginLeft = 80;
        const marginRight = 80;

        const canvasW = canvas.width;
        const canvasH = canvas.height;
        const drawW = canvasW - marginLeft - marginRight;
        const drawH = canvasH - marginTop - marginBottom;

        const scale = Math.min(drawW / rangeX, drawH / rangeY);
        const offsetX = (drawW - rangeX * scale) / 2 + marginLeft;
        const offsetY = (drawH - rangeY * scale) / 2 + marginTop;

        function toPixel(x, y) {
            return { x: (x - minX) * scale + offsetX, y: (y - minY) * scale + offsetY };
        }

        ctx.clearRect(0, 0, canvasW, canvasH);

        // Сетка
        ctx.strokeStyle = 'rgba(102,204,255,0.05)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < 10; i++) {
            const x = marginLeft + i * drawW / 10;
            ctx.beginPath();
            ctx.moveTo(x, marginTop);
            ctx.lineTo(x, canvasH - marginBottom);
            ctx.stroke();
            const y = marginTop + i * drawH / 10;
            ctx.beginPath();
            ctx.moveTo(marginLeft, y);
            ctx.lineTo(canvasW - marginRight, y);
            ctx.stroke();
        }

        // Центры ворот
        const gateCenters = gates.map(g => {
            let cx = 0, cy = 0;
            g.vertices.forEach(v => { cx += v.x; cy += v.y; });
            cx /= g.vertices.length;
            cy /= g.vertices.length;
            return { id: g.id, x: cx, y: cy };
        });

        // Рисуем ворота (полигоны)
        gates.forEach(g => {
            const pts = g.vertices.map(v => toPixel(v.x, v.y));
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) {
                ctx.lineTo(pts[i].x, pts[i].y);
            }
            ctx.closePath();
            ctx.strokeStyle = '#66ccff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = 'rgba(102,204,255,0.08)';
            ctx.fill();
        });

        // ---- Подписи ----
        const labelOffset = 35;

        for (let i = 1; i <= 8; i++) {
            const small = gateCenters.find(c => c.id === i);
            const big = gateCenters.find(c => c.id === i + 8);
            if (!small || !big) continue;
            const midX = (small.x + big.x) / 2;
            const midY = (small.y + big.y) / 2;
            const pos = toPixel(midX, midY);

            // Верхняя подпись – малый номер (или СТАРТ для i=1)
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            let label = (i === 1) ? 'СТАРТ' : i.toString();
            ctx.fillStyle = (i === 1) ? '#ff4466' : '#ff4466'; // все малые номера – красные
            ctx.font = (i === 1) ? 'bold 18px Arial' : 'bold 16px Arial';
            ctx.fillText(label, pos.x, pos.y - labelOffset);

            // Нижняя подпись – большой номер
            let bigLabel = big.id.toString();
            let color = (big.id === 9) ? '#ffffff' : '#4488ff'; // 9 – белый, остальные – синие
            ctx.textBaseline = 'top';
            ctx.fillStyle = color;
            ctx.font = 'bold 16px Arial';
            ctx.fillText(bigLabel, pos.x, pos.y + labelOffset);
        }

        // Финиш (ворота 17) – синий
        const finish = gateCenters.find(c => c.id === 17);
        if (finish) {
            const pos = toPixel(finish.x, finish.y);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillStyle = '#4488ff';
            ctx.font = 'bold 18px Arial';
            ctx.fillText('ФИНИШ', pos.x, pos.y + 65);
        }

        // Рисуем пилоны (без номеров)
        pylons.forEach(p => {
            const pos = toPixel(p.x, p.y);
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 6, 0, 2 * Math.PI);
            ctx.fillStyle = '#ff4466';
            ctx.fill();
            ctx.strokeStyle = '#ff8899';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        });

        // Блок с координатами УДАЛЁН
    </script>
</body>
</html>
