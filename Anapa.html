<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трасса «Анапа» — ViRAG (интерактив)</title>
    <style>
        body {
            background: #0a0e1a;
            color: #e0e8f0;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            user-select: none;
        }
        h1 {
            color: #66ccff;
            text-shadow: 0 0 20px rgba(102,204,255,0.3);
            margin-bottom: 5px;
            font-size: 24px;
        }
        .info {
            color: #88ddff;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .canvas-wrapper {
            position: relative;
            border: 1px solid rgba(102,204,255,0.2);
            border-radius: 12px;
            background: #0d1225;
            box-shadow: 0 0 40px rgba(102,204,255,0.05);
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }
        .canvas-wrapper:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 1000px;
            height: 650px;
            max-width: 100%;
            height: auto;
            background: #0d1225;
        }
        .controls-hint {
            margin-top: 10px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 12px;
            color: #88ddff;
            opacity: 0.7;
        }
        .controls-hint span {
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 12px;
        }
        .reset-btn {
            background: rgba(102,204,255,0.15);
            border: 1px solid #66ccff;
            color: #66ccff;
            padding: 4px 16px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .reset-btn:hover {
            background: rgba(102,204,255,0.3);
        }
        .legend {
            margin-top: 10px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 13px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-color { width: 20px; height: 4px; border-radius: 2px; }
        .legend-color.polygon { background: #66ccff; }
        .legend-color.pylon {
            display: inline-block;
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 16px solid #ff4466;
        }
        .footer {
            margin-top: 10px;
            color: #556677;
            font-size: 12px;
        }
        @media (max-width: 1024px) {
            canvas { width: 100%; height: auto; }
        }
    </style>
</head>
<body>
    <h1>✈️ Трасса «Анапа»</h1>
    <div class="info">17 ворот · 12 пилонов</div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="trackCanvas" width="1000" height="650"></canvas>
    </div>
    <div class="controls-hint">
        <span>🖱 ЛКМ + drag = панорамирование</span>
        <span>🔄 ПКМ + drag = вращение</span>
        <span>🔍 Колесо = масштаб</span>
        <span>🔄 Двойной клик = сброс</span>
        <button class="reset-btn" id="resetViewBtn">Сбросить вид</button>
    </div>
    <div class="legend">
        <span class="legend-item"><span class="legend-color polygon"></span> Ворота</span>
        <span class="legend-item"><span class="legend-color pylon"></span> Пилоны (конусы)</span>
        <span class="legend-item"><span style="color:#88ddff;">Цифры</span> — номера ворот</span>
        <span class="legend-item"><span style="color:#ff4466;">Круг-1</span>
        <span class="legend-item"><span style="color:#4488ff;">Круг-2</span>
    </div>
    <div class="footer">Данные из миссии ViRAG</div>

    <script>
        // ============================================================
        //  Данные трассы «Анапа»
        // ============================================================

        const gates = [
            { id: 1, vertices: [
                {x: -6381.1129413424, y: 240324.94226134},
                {x: -6379.4704366602, y: 240365.18362605},
                {x: -6372.1964873534, y: 240364.83166076},
                {x: -6374.0149746801, y: 240324.88360045}
            ]},
            { id: 2, vertices: [
                {x: -6042.6221146205, y: 240434.48280199},
                {x: -6048.1343849289, y: 240479.10873502},
                {x: -6040.8042382422, y: 240479.98835262},
                {x: -6035.6438149747, y: 240435.42106077}
            ]},
            { id: 3, vertices: [
                {x: -5806.2633268784, y: 240376.92187158},
                {x: -5800.1929292244, y: 240422.17939073},
                {x: -5793.0406785231, y: 240421.09753768},
                {x: -5798.9307673359, y: 240375.90012148}
            ]},
            { id: 4, vertices: [
                {x: -5555.5459211292, y: 240394.06583526},
                {x: -5557.2991777161, y: 240440.79686659},
                {x: -5549.9489866403, y: 240440.99916543},
                {x: -5548.2631629991, y: 240394.67273177}
            ]},
            { id: 5, vertices: [
                {x: -5256.4638144904, y: 240202.20585962},
                {x: -5245.2136148422, y: 240240.86206887},
                {x: -5238.0187197183, y: 240238.89982475},
                {x: -5249.334327504, y: 240200.57065618}
            ]},
            { id: 6, vertices: [
                {x: -5699.0814846166, y: 240098.65916004},
                {x: -5699.4428595098, y: 240138.55494825},
                {x: -5688.3749446781, y: 240138.6439782},
                {x: -5688.3749446781, y: 240098.6439782}
            ]},
            { id: 7, vertices: [
                {x: -5990.3300597895, y: 239896.85385218},
                {x: -5995.696230085, y: 239944.07615078},
                {x: -5988.8479746603, y: 239944.79164016},
                {x: -5983.3795915973, y: 239897.72266071}
            ]},
            { id: 8, vertices: [
                {x: -6342.704204288, y: 239947.64946198},
                {x: -6341.0163935122, y: 239986.99291316},
                {x: -6333.7413470649, y: 239986.58551056},
                {x: -6335.4873582123, y: 239947.24205938}
            ]},
            { id: 9, vertices: [
                {x: -6381.1129413424, y: 240325.00092222},
                {x: -6379.2944540157, y: 240365.18362605},
                {x: -6372.2551482349, y: 240364.714339},
                {x: -6374.0149746801, y: 240324.82493957}
            ]},
            { id: 10, vertices: [
                {x: -6042.6221146205, y: 240434.30687847},
                {x: -6048.0171025819, y: 240479.10873502},
                {x: -6040.9215205892, y: 240480.0469938},
                {x: -6035.8197384952, y: 240435.30377842}
            ]},
            { id: 11, vertices: [
                {x: -5799.0509732301, y: 240375.96022443},
                {x: -5793.0406785231, y: 240421.21774357},
                {x: -5800.2530321714, y: 240422.11928778},
                {x: -5806.2633268784, y: 240376.92187158}
            ]},
            { id: 12, vertices: [
                {x: -5555.4784881835, y: 240394.06583526},
                {x: -5557.2991777161, y: 240440.72943365},
                {x: -5550.1512854773, y: 240440.99916543},
                {x: -5548.3980288904, y: 240394.67273177}
            ]},
            { id: 13, vertices: [
                {x: -5256.3984063529, y: 240202.27126776},
                {x: -5245.2136148422, y: 240240.92747701},
                {x: -5238.1495359933, y: 240238.89982475},
                {x: -5249.2689193665, y: 240200.50524804}
            ]},
            { id: 14, vertices: [
                {x: -5699.0814846166, y: 240098.87598497},
                {x: -5699.4428595098, y: 240138.48267327},
                {x: -5692.2876366236, y: 240138.48267327},
                {x: -5691.998536709, y: 240098.87598497}
            ]},
            { id: 15, vertices: [
                {x: -5990.3300597895, y: 239896.85385218},
                {x: -5995.6451237013, y: 239944.12725717},
                {x: -5988.7457618928, y: 239944.89385292},
                {x: -5983.3795915973, y: 239897.72266071}
            ]},
            { id: 16, vertices: [
                {x: -6342.704204288, y: 239947.5912616},
                {x: -6340.9581931406, y: 239986.93471279},
                {x: -6333.7413470649, y: 239986.64371093},
                {x: -6335.4873582123, y: 239947.24205938}
            ]},
            { id: 17, vertices: [
                {x: -6381.1129413424, y: 240324.88360045},
                {x: -6379.3531148972, y: 240365.18362605},
                {x: -6372.2551482349, y: 240364.714339},
                {x: -6373.9563137986, y: 240324.76627869}
            ]}
        ];

        const pylons = [
            { id: 1, x: -6379.5946325629, y: 240358.1835623 },
            { id: 2, x: -6380.6916578947, y: 240331.88752083 },
            { id: 3, x: -6043.4298960764, y: 240441.40088616 },
            { id: 4, x: -5800.926763856, y: 240415.21532217 },
            { id: 5, x: -5555.6055302239, y: 240401.00609776 },
            { id: 6, x: -5246.8982662227, y: 240234.16789778 },
            { id: 7, x: -5254.1438890772, y: 240208.86912341 },
            { id: 8, x: -5692.2961470541, y: 240131.49182578 },
            { id: 9, x: -5692.0385861089, y: 240105.88799778 },
            { id: 10, x: -5987.9869655225, y: 239937.90757653 },
            { id: 11, x: -6334.1662080195, y: 239979.6565022 },
            { id: 12, x: -6335.2868346986, y: 239954.22427357 }
        ];

        // ============================================================
        //  Состояние камеры
        // ============================================================

        const state = {
            rotation: 0,          // угол поворота вокруг Y (радианы)
            scale: 1,            // масштаб (относительный)
            offsetX: 0,          // смещение по X (пиксели)
            offsetY: 0,          // смещение по Y (пиксели)
            baseScale: 1,        // базовый масштаб, вычисленный для вписывания
        };

        const canvas = document.getElementById('trackCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        // Собираем все точки для определения границ (без учёта высоты)
        let allPoints = [];
        gates.forEach(g => g.vertices.forEach(v => allPoints.push({x: v.x, z: v.y})));
        pylons.forEach(p => allPoints.push({x: p.x, z: p.y}));

        const minX = Math.min(...allPoints.map(p => p.x));
        const maxX = Math.max(...allPoints.map(p => p.x));
        const minZ = Math.min(...allPoints.map(p => p.z));
        const maxZ = Math.max(...allPoints.map(p => p.z));

        const rangeX = maxX - minX;
        const rangeZ = maxZ - minZ;

        // Вычисляем базовый масштаб (как раньше, но без смещения)
        const margin = 100;
        const drawW = W - 2 * margin;
        const drawH = H - 2 * margin;
        const cosA = 0.8;
        const sinA = 0.6;
        const approxWidth = (rangeX + rangeZ) * cosA;
        const approxHeight = (rangeX + rangeZ) * sinA;
        state.baseScale = Math.min(drawW / approxWidth, drawH / approxHeight);

        // Центр трассы (в мировых координатах)
        const centerX = (minX + maxX) / 2;
        const centerZ = (minZ + maxZ) / 2;

        // Функция проекции с учётом поворота, масштаба и смещения
        function isoProject(x, z, height = 0) {
            // Смещаем к центру
            let dx = x - centerX;
            let dz = z - centerZ;

            // Поворот вокруг Y
            const rot = state.rotation;
            const cosR = Math.cos(rot);
            const sinR = Math.sin(rot);
            const rx = dx * cosR - dz * sinR;
            const rz = dx * sinR + dz * cosR;

            // Изометрическая проекция (базовые коэффициенты)
            const screenX = (rx - rz) * cosA * state.baseScale * state.scale + W/2 + state.offsetX;
            const screenY = (rx + rz) * sinA * state.baseScale * state.scale - height * state.baseScale * state.scale + H/2 + state.offsetY;

            return { x: screenX, y: screenY };
        }

        // ============================================================
        //  Управление мышью
        // ============================================================

        let isPanning = false;
        let isRotating = false;
        let prevMouseX = 0, prevMouseY = 0;

        const wrapper = document.getElementById('canvasWrapper');

        // Обработчики для мыши
        wrapper.addEventListener('mousedown', (e) => {
            if (e.button === 0) { // левая кнопка — панорамирование
                isPanning = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                wrapper.style.cursor = 'grabbing';
            } else if (e.button === 2) { // правая кнопка — вращение
                isRotating = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                wrapper.style.cursor = 'grabbing';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                const dx = e.clientX - prevMouseX;
                const dy = e.clientY - prevMouseY;
                state.offsetX += dx;
                state.offsetY += dy;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                render();
            } else if (isRotating) {
                const dx = e.clientX - prevMouseX;
                // Поворачиваем пропорционально движению мыши
                state.rotation += dx * 0.01;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                render();
            }
        });

        window.addEventListener('mouseup', () => {
            if (isPanning || isRotating) {
                isPanning = false;
                isRotating = false;
                wrapper.style.cursor = 'grab';
            }
        });

        // Колесо мыши — масштабирование
        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            state.scale = Math.min(Math.max(state.scale * delta, 0.2), 5);
            render();
        }, { passive: false });

        // Двойной клик — сброс
        wrapper.addEventListener('dblclick', () => {
            resetView();
        });

        // Кнопка сброса
        document.getElementById('resetViewBtn').addEventListener('click', resetView);

        function resetView() {
            state.rotation = 0;
            state.scale = 1;
            state.offsetX = 0;
            state.offsetY = 0;
            render();
        }

        // Предотвращаем контекстное меню на canvas
        wrapper.addEventListener('contextmenu', (e) => e.preventDefault());

        // ============================================================
        //  Рендеринг
        // ============================================================

        function render() {
            ctx.clearRect(0, 0, W, H);

            // Сетка (в мировых координатах, но с поворотом)
            ctx.strokeStyle = 'rgba(102,204,255,0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < 10; i++) {
                const t = i / 9;
                const x = minX + t * rangeX;
                const z = minZ + t * rangeZ;
                const p1 = isoProject(x, minZ);
                const p2 = isoProject(x, maxZ);
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
                const p3 = isoProject(minX, z);
                const p4 = isoProject(maxX, z);
                ctx.beginPath();
                ctx.moveTo(p3.x, p3.y);
                ctx.lineTo(p4.x, p4.y);
                ctx.stroke();
            }

            // Ворота
            gates.forEach(g => {
                const pts = g.vertices.map(v => isoProject(v.x, v.y, 0));
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) {
                    ctx.lineTo(pts[i].x, pts[i].y);
                }
                ctx.closePath();
                ctx.strokeStyle = '#66ccff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = 'rgba(102,204,255,0.08)';
                ctx.fill();
            });

            // Пилоны – конусы
            const coneHeight = 25;
            const coneRadius = 4.5;

            pylons.forEach(p => {
                const baseCenter = isoProject(p.x, p.y, 0);
                const tip = isoProject(p.x, p.y, coneHeight);

                const r = coneRadius * state.baseScale * state.scale;
                const rx = r;
                const ry = r * 0.5;

                // Основание
                ctx.beginPath();
                ctx.ellipse(baseCenter.x, baseCenter.y, rx, ry, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#661122';
                ctx.fill();
                ctx.strokeStyle = '#ff4466';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Боковая поверхность
                const left = { x: baseCenter.x - rx, y: baseCenter.y };
                const right = { x: baseCenter.x + rx, y: baseCenter.y };
                ctx.beginPath();
                ctx.moveTo(tip.x, tip.y);
                ctx.lineTo(left.x, left.y);
                ctx.lineTo(right.x, right.y);
                ctx.closePath();
                ctx.fillStyle = 'rgba(255,68,102,0.25)';
                ctx.fill();
                ctx.strokeStyle = '#ff4466';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Образующие
                const angleStep = Math.PI / 6;
                for (let ang = 0; ang < Math.PI * 2; ang += angleStep) {
                    const ex = baseCenter.x + rx * Math.cos(ang);
                    const ey = baseCenter.y + ry * Math.sin(ang);
                    ctx.beginPath();
                    ctx.moveTo(tip.x, tip.y);
                    ctx.lineTo(ex, ey);
                    ctx.strokeStyle = 'rgba(255,68,102,0.3)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // Вершина
                ctx.beginPath();
                ctx.arc(tip.x, tip.y, 3, 0, 2 * Math.PI);
                ctx.fillStyle = '#ff4466';
                ctx.fill();
            });

            // Подписи ворот (вычисляем центры, но используем их координаты с поворотом)
            const gateCenters = gates.map(g => {
                let cx = 0, cz = 0;
                g.vertices.forEach(v => { cx += v.x; cz += v.y; });
                cx /= g.vertices.length;
                cz /= g.vertices.length;
                return { id: g.id, x: cx, z: cz };
            });

            const labelOffset = 30;

            // Для Anapa: пары 1-9, 2-10, ... 8-16
            for (let i = 1; i <= 8; i++) {
                const small = gateCenters.find(c => c.id === i);
                const big = gateCenters.find(c => c.id === i + 8);
                if (!small || !big) continue;
                const midX = (small.x + big.x) / 2;
                const midZ = (small.z + big.z) / 2;
                const pos = isoProject(midX, midZ, 0);

                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                let label = (i === 1) ? 'СТАРТ' : i.toString();
                ctx.fillStyle = (i === 1) ? '#ff4466' : '#ff4466';
                ctx.font = (i === 1) ? 'bold 16px Arial' : 'bold 14px Arial';
                ctx.fillText(label, pos.x, pos.y - labelOffset);

                const bigId = i + 8;
                ctx.textBaseline = 'top';
                ctx.fillStyle = (bigId === 9) ? '#ffffff' : '#4488ff';
                ctx.font = 'bold 14px Arial';
                ctx.fillText(bigId.toString(), pos.x, pos.y + labelOffset);
            }

            // Финиш (ворота 17)
            const finish = gateCenters.find(c => c.id === 17);
            if (finish) {
                const pos = isoProject(finish.x, finish.z, 0);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillStyle = '#4488ff';
                ctx.font = 'bold 16px Arial';
                ctx.fillText('ФИНИШ', pos.x, pos.y + 45);
            }

            // Информация о масштабе (опционально)
            ctx.fillStyle = '#556677';
            ctx.font = '11px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`Масштаб: ${(state.scale * state.baseScale).toFixed(3)}`, 15, H - 10);
        }

        // Первый рендер
        resetView();

        // ============================================================
        //  Адаптация под изменение размера (необязательно)
        // ============================================================

        // При изменении размера окна можно пересчитать baseScale, но для простоты оставим как есть.
        // Если нужно адаптировать под размеры контейнера, можно добавить ResizeObserver.

        console.log('Anapa interactive ready');
    </script>
</body>
