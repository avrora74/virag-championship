<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ViRAG Чемпионат 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* ===== ГЛОБАЛЬНЫЕ СТИЛИ ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e1a;
            color: #e0e8f0;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container { max-width: 1300px; width: 100%; }

        /* ===== ХЕДЕР ===== */
        .header {
            display: flex;
            align-items: center;
            gap: 25px;
            padding: 15px 0;
            border-bottom: 2px solid #66ccff;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .logo {
            height: 70px;
            width: auto;
            filter: drop-shadow(0 0 20px rgba(102,204,255,0.3));
        }
        .header-text { flex: 1; }
        .header-text h1 {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 30px rgba(102,204,255,0.4);
            letter-spacing: 1px;
        }
        .header-text .sub {
            font-size: 16px;
            color: #88ddff;
            margin-top: 4px;
            font-weight: 300;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }
        .header-text .sub span { font-weight: 600; color: #00ff88; }
        .header-text .sub .rules-link {
            color: #88ddff;
            text-decoration: none;
            border-bottom: 1px dashed rgba(102,204,255,0.3);
            transition: 0.2s;
            font-size: 15px;
        }
        .header-text .sub .rules-link:hover {
            color: #66ccff;
            border-bottom-color: #66ccff;
        }

        /* ===== ВКЛАДКИ ===== */
        .tabs {
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(102,204,255,0.15);
            padding-bottom: 12px;
        }
        .main-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .main-tabs .stage-label {
            color: #88ddff;
            font-size: 14px;
            font-weight: 500;
            margin: 0 4px 0 8px;
        }
        .analytics-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;

            border-top: 1px solid rgba(102,204,255,0.1);
            padding-top: 10px;
        }
        .tab {

            border: 1px solid rgba(102,204,255,0.15);

        .tab:hover {

            border-color: #66ccff;
        }
        .tab.active {

            border-color: #66ccff;
            color: #fff;
            box-shadow: 0 0 20px rgba(102,204,255,0.1);
        }
        .tab.stage-tab {
            font-size: 13px;
            padding: 6px 14px;
            background: rgba(255,255,255,0.05);
            border-color: rgba(102,204,255,0.08);
        }
        .tab.stage-tab.active {

        }
        th {

            color: #88ddff;
            font-weight: 600;
            padding: 14px 12px;
            text-align: left;
            border-bottom: 2px solid rgba(102,204,255,0.2);

        td {

            border-bottom: 1px solid rgba(255,255,255,0.04);

        }
        tr:hover td { background: rgba(102,204,255,0.04); }
        .pos {
            font-weight: 700;
            text-align: center;

        }
        .pos.gold { color: #ffd700; }
        .pos.silver { color: #c0c0c0; }
        .pos.bronze { color: #cd7f32; }
        .pilot-name {

            color: #ffffff;

        }
        .pilot-name:hover {

        }
        .time { font-weight: 500; color: #66ccff; }
        .points { font-weight: 700; color: #00ff88; }
        .podium-bonus { color: #ffcc44; font-size: 0.8em; margin-left: 4px; }
        .stage-title {
            font-size: 20px;
            font-weight: 600;
            color: #66ccff;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(102,204,255,0.2);
        }
        .change-arrow {

            font-size: 18px;
            font-weight: 700;
            margin-left: 8px;

            text-align: center;

        .change-arrow.up { color: #00ff88; }
        .change-arrow.down { color: #ff4466; }

        .dnf-badge {

        /* ===== МОДАЛЬНОЕ ОКНО СТАТИСТИКИ ПИЛОТА ===== */
        .modal-overlay {

            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);

        .modal {

        .chart-container {

            max-width: 100%;

        }

        .insights-container h2 {

        .insight-block.leader { border-color: #ffd700; background: rgba(255,215,0,0.05); }
        .insight-block.battle { border-color: #66ccff; background: rgba(102,204,255,0.05); }
        .insight-block.dnf { border-color: #ff4466; background: rgba(255,68,102,0.05); }
        .insight-block.penalty { border-color: #ffcc44; background: rgba(255,204,68,0.05); }
        .insight-block.missed { border-color: #88ddff; background: rgba(136,221,255,0.05); }
        .insight-block.perfect { border-color: #00ff88; background: rgba(0,255,136,0.05); }
        .insight-block.error { border-color: #ff8844; background: rgba(255,136,68,0.05); }
        .insight-block.stability { border-color: #66ccff; background: rgba(102,204,255,0.05); }
        .insight-block.trend { border-color: #88ddff; background: rgba(136,221,255,0.05); }
        .insight-block.forecast { border-color: #ffd700; background: rgba(255,215,0,0.05); }
        .insight-block.recommendation { border-color: #66ccff; background: rgba(102,204,255,0.02); }
        .insight-block.stream { border-color: #ffcc44; background: rgba(255,204,68,0.05); }

        .insight-block .highlight { color: #ffd700; }

        .loading, .error, .empty {

            content: '...';
            animation: dots 1.2s steps(3) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            33% { content: '.'; }
            66% { content: '..'; }
            100% { content: '...'; }
        }
        .error { color: #ff4466; }
        .empty { color: #8899aa; }

        .footer {
            margin-top: 30px;

            .modal { padding: 20px; }

            .rules-content { font-size: 14px; padding: 15px; }
            .penalty-icons-cell img { height: 16px; width: 16px; }
            .stat-card .value { font-size: 16px; }
