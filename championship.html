    class App {
        constructor() {
            this.loader = new DataLoader();
            this.renderer = new Renderer('content', 'modalOverlay');
            this.calculator = null;
            this.currentTab = 'overall';
            this.isLoading = false;
            this._bindEvents();
        }

        _bindEvents() {
            document.addEventListener('tabChange', (e) => {
                this.switchTab(e.detail.tab);
            });

            document.addEventListener('showPilotStats', (e) => {
                this.showPilotStats(e.detail.pilot);
            });

            document.getElementById('updateBtn').addEventListener('click', () => {
                this.init();
            });
        }

        async init() {
            if (this.isLoading) return;
            this.isLoading = true;
            this.renderer.showLoading();

            try {
                const values = await this.loader.fetchData();
                const headers = values[0];
                const rows = values.slice(1);

                this.calculator = new ScoreCalculator(rows, headers);
                const result = this.calculator.process();
                const stages = result.stages;
                const overall = result.overall;

                this.renderer.updateHeader(Object.keys(overall).length, Object.keys(stages).length);

                this.renderer.renderTabs(stages, this.currentTab);
                this.renderer.renderTab(this.currentTab, this.calculator, null);
            } catch (err) {
                console.error(err);
                this.renderer.showError(err.message || 'Ошибка загрузки данных');
            } finally {
                this.isLoading = false;
            }
        }

        switchTab(tabName) {
            if (!this.calculator) return;
            this.currentTab = tabName;
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === tabName);
            });
            this.renderer.renderTab(tabName, this.calculator, null);
        }

        showPilotStats(pilotName) {
            if (!this.calculator) return;
            const stats = this.calculator.getPilotStats(pilotName);
            if (!stats || Object.keys(stats).length === 0) {
                this.renderer.showModal(`Статистика: ${pilotName}`, '<p style="color:#8899aa;">Нет данных для этого пилота.</p>');
                return;
            }

            const tracks = Object.keys(stats).sort();
            let totalAll = 0, totalDnf = 0, totalPenalty = 0;
            tracks.forEach(track => {
                const s = stats[track];
                totalAll += s.total;
                totalDnf += s.dnf;
                totalPenalty += s.penaltySum;
            });

            let html = `<div style="margin-bottom:15px;">
                <p><strong>Всего попыток:</strong> ${totalAll} &nbsp;|&nbsp;
                <strong>Всего DNF:</strong> ${totalDnf} &nbsp;|&nbsp;
                <strong>Сумма штрафов (сек):</strong> ${totalPenalty.toFixed(1)}</p>
            </div>`;

            html += `<div class="track-selector" id="modalTrackSelector">`;
            tracks.forEach((track, idx) => {
                const active = idx === 0 ? 'active' : '';
                html += `<button class="track-btn ${active}" data-track="${track}">${track}</button>`;
            });
            html += `</div>`;

            html += `<div id="modalAttemptsContainer"></div>`;

            this.renderer.showModal(`Статистика: ${pilotName}`, html);

            const renderAttempts = (track) => {
                const container = document.getElementById('modalAttemptsContainer');
                const trackData = stats[track];
                if (!trackData || trackData.attempts.length === 0) {
                    container.innerHTML = '<p style="color:#8899aa;">Нет попыток на этой трассе.</p>';
                    return;
                }

                let bestValidTime = Infinity;
                trackData.attempts.forEach(att => {
                    if (!att.isDnf && att.validTime > 0 && att.validTime < bestValidTime) {
                        bestValidTime = att.validTime;
                    }
                });

                let tableHtml = `<table class="attempts-table">
                    <thead><tr>
                        <th>№ попытки</th>
                        <th>Дата/время</th>
                        <th>Стартовая скорость (км/ч)</th>
                        <th>Стартовое топливо (%)</th>
                        <th>Зачётное время</th>
                        <th>Чистое время</th>
                        <th>Штраф (сек)</th>
                        <th>Коды штрафов</th>
                        <th>Причина DNF</th>
                    </tr></thead><tbody>`;

                trackData.attempts.forEach(att => {
                    const isDnf = att.isDnf;
                    let validTimeDisplay;
                    let tdClass = '';
                    if (isDnf) {
                        validTimeDisplay = '<span class="dnf-text">DNF</span>';
                    } else {
                        const timeValue = att.validTime || 0;
                        const isBest = (timeValue === bestValidTime && bestValidTime !== Infinity);
                        tdClass = isBest ? 'best-time' : '';
                        validTimeDisplay = this.renderer._formatTime(timeValue);
                    }

                    let totalTimeDisplay = '—';
                    if (!isDnf && att.totalTime > 0) {
                        totalTimeDisplay = this.renderer._formatTime(att.totalTime);
                    }
                    const penalty = att.penalty || 0;
                    let imagesHtml = '';
                    if (att.penaltyCodes) {
                        const codes = att.penaltyCodes.split(',').map(s => s.trim()).filter(s => s !== '');
                        codes.forEach(code => {
                            const num = parseInt(code);
                            if (!isNaN(num) && num >= 1 && num <= 6) {
                                imagesHtml += `<img src="penalty_${num}.png" class="penalty-icon" alt="штраф ${num}" title="Код ${num}" onerror="this.style.display='none'">`;
                            }
                        });
                    }
                    if (!imagesHtml) imagesHtml = '—';

                    let timestampDisplay = '—';
                    if (att.timestamp) {
                        try {
                            const date = new Date(att.timestamp);
                            if (!isNaN(date.getTime())) {
                                timestampDisplay = date.toLocaleString('ru-RU', {
                                    day: '2-digit',
                                    month: '2-digit',
                                    year: 'numeric',
                                    hour: '2-digit',
                                    minute: '2-digit',
                                    second: '2-digit'
                                });
                            }
                        } catch (e) { /* ignore */ }
                    }

                    const startSpeedDisplay = (att.startSpeed !== null && att.startSpeed !== undefined && !isNaN(att.startSpeed)) ? att.startSpeed.toFixed(1) : '—';
                    const startFuelDisplay = (att.startFuel !== null && att.startFuel !== undefined && !isNaN(att.startFuel)) ? att.startFuel.toFixed(1) : '—';

                    let dnfReasonDisplay = '—';
                    if (isDnf) {
                        const norm = this.renderer._normalizeDnfReason(att.dnfReason, att.penaltyCodes);
                        dnfReasonDisplay = norm;
                    }

                    tableHtml += `<tr>
                        <td>${att.attemptNumber}</td>
                        <td>${timestampDisplay}</td>
                        <td>${startSpeedDisplay}</td>
                        <td>${startFuelDisplay}</td>
                        <td class="${tdClass}">${validTimeDisplay}</td>
                        <td>${totalTimeDisplay}</td>
                        <td>${penalty.toFixed(1)}</td>
                        <td>${imagesHtml}</td>
                        <td>${dnfReasonDisplay}</td>
                    </tr>`;
                });

                tableHtml += '</tbody></table>';
                container.innerHTML = tableHtml;
            };

            const modalButtons = document.querySelectorAll('#modalTrackSelector .track-btn');
            modalButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    modalButtons.forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    const track = e.currentTarget.dataset.track;
                    renderAttempts(track);
                });
            });

            if (tracks.length > 0) {
                renderAttempts(tracks[0]);
            }
        }
    }

    // ================================================================
    //  ЗАПУСК
    // ================================================================
    document.addEventListener('DOMContentLoaded', () => {
        const app = new App();
        app.init();
    });
</script>
</body>
</html>
