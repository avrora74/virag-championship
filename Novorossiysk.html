<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        body {
            background: #0a0e1a;
            color: #e0e8f0;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            user-select: none;
        }
        h1 {
            color: #66ccff;
            text-shadow: 0 0 20px rgba(102,204,255,0.3);
            margin-bottom: 5px;
            font-size: 24px;
        }
        .info {
            color: #88ddff;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .canvas-wrapper {
            position: relative;
            border: 1px solid rgba(102,204,255,0.2);
            border-radius: 12px;
            background: #0d1225;
            box-shadow: 0 0 40px rgba(102,204,255,0.05);
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }
        .canvas-wrapper:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 1000px;
            height: 650px;
            max-width: 100%;
            height: auto;
            background: #0d1225;
        }
        .controls-hint {
            margin-top: 10px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 12px;
            color: #88ddff;
            opacity: 0.7;
        }
        .controls-hint span {
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 12px;
        }
        .reset-btn {
            background: rgba(102,204,255,0.15);
            border: 1px solid #66ccff;
            color: #66ccff;
            padding: 4px 16px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .reset-btn:hover {
            background: rgba(102,204,255,0.3);
        }
        .legend {
            margin-top: 10px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 13px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-color { width: 20px; height: 4px; border-radius: 2px; }
        .legend-color.polygon { background: #66ccff; }
        .legend-color.pylon {
            display: inline-block;
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 16px solid #ff4466;
        }
        .footer {
            margin-top: 10px;
            color: #556677;
            font-size: 12px;
        }
        @media (max-width: 1024px) {
            canvas { width: 100%; height: auto; }
        }
    </style>
</head>

    <div class="info">25 ворот · 11 пилонов</div>

    </div>

            ]},
            { id: 23, vertices: [
                {x: -38872.221383778, y: 280853.99912675},
                {x: -38838.898410667, y: 280885.99838936},
                {x: -38834.179094959, y: 280881.04886313},

            { id: 24, vertices: [
                {x: -39078.886710423, y: 281138.70180074},
                {x: -39049.932613879, y: 281165.88901344},
                {x: -39044.859947359, y: 281160.87334317},
                {x: -39073.985032662, y: 281133.45814546}
            ]},
            { id: 25, vertices: [
                {x: -39370.418067608, y: 281338.3313091},
                {x: -39341.506060782, y: 281365.26543216},
                {x: -39336.503178314, y: 281360.32072274},
                {x: -39365.647877347, y: 281332.92121527}
            ]}
        ];

        const pylons = [
            { id: 1, x: -39341.640445211, y: 281355.56889346 },
            { id: 2, x: -39360.651869565, y: 281337.83764685 },
            { id: 3, x: -39050.038034184, y: 281156.10629096 },
            { id: 4, x: -39069.006315389, y: 281138.29470224 },
            { id: 5, x: -38839.185886597, y: 280876.19361087 },
            { id: 6, x: -38687.583892338, y: 280748.04810072 },
            { id: 7, x: -38546.574353867, y: 280607.53868382 },
            { id: 8, x: -38017.774481815, y: 280501.14652663 },
            { id: 9, x: -38034.247760663, y: 280480.69296227 },
            { id: 10, x: -37668.898910887, y: 280307.82161839 },
            { id: 11, x: -37688.408161334, y: 280290.59287921 }
        ];

        // ============================================================
        //  Состояние камеры
        // ============================================================

        const state = {
            rotation: 0,
            scale: 1,
            offsetX: 0,
            offsetY: 0,
            baseScale: 1,
        };

        const canvas = document.getElementById('trackCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        let allPoints = [];
        gates.forEach(g => g.vertices.forEach(v => allPoints.push({x: v.x, z: v.y})));
        pylons.forEach(p => allPoints.push({x: p.x, z: p.y}));

        const minX = Math.min(...allPoints.map(p => p.x));
        const maxX = Math.max(...allPoints.map(p => p.x));
        const minZ = Math.min(...allPoints.map(p => p.z));
        const maxZ = Math.max(...allPoints.map(p => p.z));

        const rangeX = maxX - minX;
        const rangeZ = maxZ - minZ;

        const margin = 100;
        const drawW = W - 2 * margin;
        const drawH = H - 2 * margin;

        // Используем коэффициенты 0.8 и 0.6 для более удобного угла
        const cosA = 0.8;
        const sinA = 0.6;
        const approxWidth = (rangeX + rangeZ) * cosA;
        const approxHeight = (rangeX + rangeZ) * sinA;
        state.baseScale = Math.min(drawW / approxWidth, drawH / approxHeight);

        const centerX = (minX + maxX) / 2;
        const centerZ = (minZ + maxZ) / 2;

        function isoProject(x, z, height = 0) {
            let dx = x - centerX;
            let dz = z - centerZ;

            const rot = state.rotation;
            const cosR = Math.cos(rot);
            const sinR = Math.sin(rot);
            const rx = dx * cosR - dz * sinR;
            const rz = dx * sinR + dz * cosR;

            const screenX = (rx - rz) * cosA * state.baseScale * state.scale + W/2 + state.offsetX;
            const screenY = (rx + rz) * sinA * state.baseScale * state.scale - height * state.baseScale * state.scale + H/2 + state.offsetY;

            return { x: screenX, y: screenY };
        }

        // ============================================================
        //  Управление мышью
        // ============================================================

        let isPanning = false;
        let isRotating = false;
        let prevMouseX = 0, prevMouseY = 0;

        const wrapper = document.getElementById('canvasWrapper');

        wrapper.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isPanning = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                wrapper.style.cursor = 'grabbing';
            } else if (e.button === 2) {
                isRotating = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                wrapper.style.cursor = 'grabbing';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                const dx = e.clientX - prevMouseX;
                const dy = e.clientY - prevMouseY;
                state.offsetX += dx;
                state.offsetY += dy;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                render();
            } else if (isRotating) {
                const dx = e.clientX - prevMouseX;
                state.rotation += dx * 0.01;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
                render();
            }
        });

        window.addEventListener('mouseup', () => {
            if (isPanning || isRotating) {
                isPanning = false;
                isRotating = false;
                wrapper.style.cursor = 'grab';
            }
        });

        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            state.scale = Math.min(Math.max(state.scale * delta, 0.2), 5);
            render();
        }, { passive: false });

        wrapper.addEventListener('dblclick', resetView);
        document.getElementById('resetViewBtn').addEventListener('click', resetView);

        function resetView() {
            state.rotation = 0;
            state.scale = 1;
            state.offsetX = 0;
            state.offsetY = 0;
            render();
        }

        wrapper.addEventListener('contextmenu', (e) => e.preventDefault());

        // ============================================================
        //  Рендеринг
        // ============================================================

        function render() {
            ctx.clearRect(0, 0, W, H);

            // Сетка
            ctx.strokeStyle = 'rgba(102,204,255,0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < 10; i++) {
                const t = i / 9;
                const x = minX + t * rangeX;
                const z = minZ + t * rangeZ;
                const p1 = isoProject(x, minZ);
                const p2 = isoProject(x, maxZ);
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
                const p3 = isoProject(minX, z);
                const p4 = isoProject(maxX, z);
                ctx.beginPath();
                ctx.moveTo(p3.x, p3.y);
                ctx.lineTo(p4.x, p4.y);
                ctx.stroke();
            }

            // Ворота
            gates.forEach(g => {
                const pts = g.vertices.map(v => isoProject(v.x, v.y, 0));
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) {
                    ctx.lineTo(pts[i].x, pts[i].y);
                }
                ctx.closePath();
                ctx.strokeStyle = '#66ccff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = 'rgba(102,204,255,0.08)';
                ctx.fill();
            });

            // Пилоны – конусы
            const coneHeight = 25;
            const coneRadius = 4.5;

            pylons.forEach(p => {
                const baseCenter = isoProject(p.x, p.y, 0);
                const tip = isoProject(p.x, p.y, coneHeight);

                const r = coneRadius * state.baseScale * state.scale;
                const rx = r;
                const ry = r * 0.5;

                ctx.beginPath();
                ctx.ellipse(baseCenter.x, baseCenter.y, rx, ry, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#661122';
                ctx.fill();
                ctx.strokeStyle = '#ff4466';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const left = { x: baseCenter.x - rx, y: baseCenter.y };
                const right = { x: baseCenter.x + rx, y: baseCenter.y };
                ctx.beginPath();
                ctx.moveTo(tip.x, tip.y);
                ctx.lineTo(left.x, left.y);
                ctx.lineTo(right.x, right.y);
                ctx.closePath();
                ctx.fillStyle = 'rgba(255,68,102,0.25)';
                ctx.fill();
                ctx.strokeStyle = '#ff4466';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                const angleStep = Math.PI / 6;
                for (let ang = 0; ang < Math.PI * 2; ang += angleStep) {
                    const ex = baseCenter.x + rx * Math.cos(ang);
                    const ey = baseCenter.y + ry * Math.sin(ang);
                    ctx.beginPath();
                    ctx.moveTo(tip.x, tip.y);
                    ctx.lineTo(ex, ey);
                    ctx.strokeStyle = 'rgba(255,68,102,0.3)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(tip.x, tip.y, 3, 0, 2 * Math.PI);
                ctx.fillStyle = '#ff4466';
                ctx.fill();
            });

            // ============================================================
            //  Подписи (скопированы из Novorossiysk1.html)
            // ============================================================

            const gateCenters = gates.map(g => {
                let cx = 0, cz = 0;
                g.vertices.forEach(v => { cx += v.x; cz += v.y; });
                cx /= g.vertices.length;
                cz /= g.vertices.length;
                return { id: g.id, x: cx, z: cz };
            });

            const labelOffset = 30;

            for (let i = 1; i <= 12; i++) {
                const small = gateCenters.find(c => c.id === i);
                const big = gateCenters.find(c => c.id === i + 12);
                if (!small || !big) continue;
                const midX = (small.x + big.x) / 2;
                const midZ = (small.z + big.z) / 2;
                const pos = isoProject(midX, midZ, 0);

                let topLabel = '';
                let bottomLabel = '';
                let topColor = '#ff4466';
                let bottomColor = '#4488ff';

                switch (i) {
                    case 1:
                        topLabel = 'СТАРТ';
                        bottomLabel = '13';
                        bottomColor = '#ffffff';
                        break;
                    case 2:
                        topLabel = '2, 12';
                        bottomLabel = '14, 24';
                        break;
                    case 3:
                        topLabel = '3, 11';
                        bottomLabel = '15, 23';
                        break;
                    case 4:
                        topLabel = '4, 10';
                        bottomLabel = '16, 22';
                        break;
                    case 5:
                        topLabel = '5, 9';
                        bottomLabel = '17, 21';
                        break;
                    case 6:
                        topLabel = '6, 8';
                        bottomLabel = '18, 20';
                        break;
                    case 7:
                        topLabel = '7';
                        bottomLabel = '19';
                        break;
                    case 8:
                    case 9:
                    case 10:
                    case 11:
                    case 12:
                        topLabel = '';
                        bottomLabel = '';
                        break;
                    default:
                        break;
                }

                if (topLabel) {
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillStyle = topColor;
                    ctx.font = (i === 1) ? 'bold 16px Arial' : 'bold 14px Arial';
                    ctx.fillText(topLabel, pos.x, pos.y - labelOffset);
                }
                if (bottomLabel) {
                    ctx.textBaseline = 'top';
                    ctx.fillStyle = bottomColor;
                    ctx.font = 'bold 14px Arial';
                    ctx.fillText(bottomLabel, pos.x, pos.y + labelOffset);
                }
            }

            // Финиш (ворота 25)
            const finish = gateCenters.find(c => c.id === 25);
            if (finish) {
                const pos = isoProject(finish.x, finish.z, 0);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillStyle = '#4488ff';
                ctx.font = 'bold 16px Arial';
                ctx.fillText('ФИНИШ', pos.x, pos.y + 45);
            }

            // Информация о масштабе
            ctx.fillStyle = '#556677';
            ctx.font = '11px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`Масштаб: ${(state.scale * state.baseScale).toFixed(3)}`, 15, H - 10);
        }

        resetView();
        console.log('Novorossiysk interactive ready');
    </script>
</body>
</html>
